<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>词根拆解 · 考研 5500 词</title>
<style>
:root{
  --pink:#c2708c; --pink-d:#a75a75; --pink-l:#EDD1D8; --pink-xl:#FBEFF3;
  --bg:#FDF8FA; --card:#fff; --txt:#3A2E33; --txt2:#8A7A81; --line:#F0DDE5;
  --ok:#5E9E72; --ok-bg:#EFF8F1; --no:#D2726F; --no-bg:#FDEFEF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.7;}
body{padding:0 0 76px;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:16px 18px 0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 6px}
.tleft{display:flex;align-items:center;gap:8px;min-width:0}
.back{flex:none;width:28px;height:28px;border-radius:50%;background:var(--card);border:1px solid var(--pink-l);
  color:var(--pink-d);display:inline-flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;line-height:1}
.back:hover{background:var(--pink-xl)}
.badge{background:var(--pink-xl);color:var(--pink-d);font-size:12.5px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--pink-l);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter{font-size:12.5px;color:var(--txt2);white-space:nowrap}
.bar{height:5px;background:var(--pink-xl);border-radius:999px;overflow:hidden;margin:8px 0 18px}
.bar>i{display:block;height:100%;width:0;background:var(--pink);border-radius:999px;transition:width .35s ease}
.qbig{font-size:20px;font-weight:600;line-height:1.75;letter-spacing:.2px;margin:0 0 16px;word-break:break-word}
.qbig .eq{color:var(--pink-d);font-weight:700}
.qbig .cn{font-size:15px;color:var(--txt2);font-weight:400;display:block;margin-top:6px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{background:var(--card);border:1.5px solid var(--pink-l);border-radius:14px;padding:14px 16px;
  font-size:16px;cursor:pointer;transition:.16s;color:var(--txt)}
.opt:hover{border-color:var(--pink)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:#2F6B45}
.opt.no{border-color:var(--no);background:var(--no-bg);color:#9C4A47}
.opt.dim{opacity:.45}
.speak{margin:12px 0 0;display:inline-flex;align-items:center;gap:7px;background:var(--card);
  border:1px solid var(--pink-l);color:var(--pink-d);border-radius:999px;padding:8px 15px;font-size:13.5px;cursor:pointer}
.why{margin:16px 0 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  font-size:15px;line-height:1.85;animation:fade .28s ease}
.why b{color:var(--pink-d)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.juan{margin:18px 0 0;border-top:1px dashed var(--line);padding-top:16px;animation:fade .28s ease}
.jtag{display:inline-block;background:#F3E8FA;color:#7A5A9E;font-size:12px;padding:3px 10px;border-radius:999px;margin-bottom:10px}
.qmid{font-size:16.5px;font-weight:600;margin:0 0 12px;line-height:1.7}
.btn{margin:22px 0 0;width:100%;background:var(--pink);color:#fff;border:none;border-radius:14px;
  padding:15px;font-size:16.5px;font-weight:600;cursor:pointer;transition:.18s;font-family:inherit}
.btn:hover{background:var(--pink-d)}
.btn.ghost{background:var(--card);color:var(--pink-d);border:1.5px solid var(--pink-l)}
.btn.ghost:hover{background:var(--pink-xl)}
.center{text-align:center}
.intro-kicker{font-size:13px;color:var(--pink-d);letter-spacing:2px;margin:8px 0 6px}
.intro-h1{font-size:31px;font-weight:700;margin:0 0 4px;letter-spacing:.5px}
.intro-sub{font-size:15px;color:var(--txt2);margin:0 0 20px}
.intro-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.intro-card h3{margin:0 0 10px;font-size:15px;color:var(--pink-d);font-weight:600}
.intro-card p{margin:0 0 10px;font-size:15px;line-height:1.9}
.intro-card p:last-child{margin-bottom:0}
.rope{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.rope div{background:var(--pink-xl);border-radius:11px;padding:10px 12px;font-size:13.5px;line-height:1.6}
.rope div.wide{grid-column:1 / -1}
.rope b{display:block;color:var(--pink-d);font-size:14.5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;text-align:center}
.stat .n{font-size:26px;font-weight:700;color:var(--pink-d);line-height:1.2}
.stat .k{font-size:12.5px;color:var(--txt2)}
.wlist{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.wlist span{background:var(--pink-xl);border-radius:8px;padding:5px 10px;font-size:13.5px;color:var(--pink-d)}
.wlist span i{font-style:normal;color:var(--txt2);font-size:12px;margin-left:4px}
.seg{text-align:center;padding:48px 10px}
.seg .ico{font-size:40px;margin-bottom:14px}
.seg h2{font-size:23px;margin:0 0 10px;color:var(--pink-d)}
.seg p{font-size:15px;color:var(--txt2);margin:0 0 26px;line-height:1.8}
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(253,248,250,.94);border-top:1px solid var(--line);
  padding:11px 18px;text-align:center;font-size:12px;color:var(--txt2)}
.foot b{color:var(--pink-d)}

/* ===== 目录页 ===== */
.epcard{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:11px;cursor:pointer;transition:.16s}
.epcard:hover{border-color:var(--pink);transform:translateY(-1px)}
.epcard-l{min-width:0}
.epcard-no{font-size:11.5px;color:var(--pink-d);letter-spacing:1.2px}
.epcard-root{font-size:19px;font-weight:700;color:var(--txt);margin:2px 0;word-break:break-word}
.epcard-mean{font-size:13px;color:var(--txt2)}
.epcard-r{flex:none;text-align:right;font-size:11.5px;color:var(--txt2);line-height:1.45}
.epcard-r b{display:block;font-size:23px;color:var(--pink-d);font-weight:700;line-height:1.15}

/* ===== 目录页季 Tab（第一季～第五季横排） ===== */
.chapters{display:flex;gap:9px;margin:18px 0 0}
.ctab{flex:1;padding:12px 8px;border-radius:15px;border:1.5px solid var(--pink-l);background:var(--card);
      color:var(--pink-d);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.5px;
      transition:all .18s}
.ctab.on{background:linear-gradient(135deg,var(--pink),var(--pink-d));border-color:var(--pink);color:#fff;
         box-shadow:0 5px 16px rgba(194,112,140,.3)}
.ctab.off{opacity:.4;cursor:default}
.chap-note{font-size:12px;color:var(--txt2);text-align:center;margin:8px 2px 0}
.seasons{display:flex;gap:7px;overflow-x:auto;padding:14px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.seasons::-webkit-scrollbar{display:none}
.stab{flex:none;background:var(--card);border:1.5px solid var(--pink-l);color:var(--pink-d);border-radius:999px;
  padding:8px 15px;font-size:13.5px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.16s}
.stab.on{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
.stab.off{opacity:.38;cursor:default}
.stab:not(.off):not(.on):hover{background:var(--pink-xl)}
.season-sum{font-size:12.5px;color:var(--txt2);margin:0 2px 12px}

/* ===== 章节导航（上一期 / 下一期，24 期连着翻） ===== */
.chnav{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:rgba(253,248,250,.95);padding:10px 0 9px;border-bottom:1px solid var(--line);margin:0 0 14px}
.cnav-btn{flex:none;background:var(--card);border:1.5px solid var(--pink-l);color:var(--pink-d);border-radius:999px;
  padding:8px 13px;font-size:13.5px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.16s}
.cnav-btn:hover{background:var(--pink-xl)}
.cnav-btn:disabled{opacity:.35;cursor:default;background:var(--card)}
.chnav .cur{min-width:0;background:#fff;border:1.5px solid var(--pink-l);border-radius:999px;padding:8px 16px;
  font-size:13.5px;font-weight:700;color:var(--pink-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}

/* ========== ▶ 演播模式（纯字幕，无人声） ========== */
body.playing{padding-bottom:0;overflow:hidden}
body.playing .foot{display:none}
.pw{position:fixed;inset:0;z-index:50;max-width:520px;margin:0 auto;
  background:linear-gradient(168deg,#FDF8FA 0%,#FCF3F6 46%,#F7E6EC 100%);
  display:flex;flex-direction:column;padding:16px 20px 12px}
.pw-top{display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size:12.5px;color:var(--txt2);letter-spacing:.4px;white-space:nowrap;overflow:hidden}
.pw-prog{height:3px;background:rgba(194,112,140,.14);border-radius:99px;margin:9px 0 0;overflow:hidden;flex:none}
.pw-prog>i{display:block;height:100%;width:0;background:var(--pink);border-radius:99px;transition:width .3s ease}
.pstage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:10px 0}
.pword{font-size:44px;font-weight:700;letter-spacing:.4px;color:var(--txt);word-break:break-word;
  animation:pop .5s cubic-bezier(.2,.8,.3,1.25);line-height:1.25}
@keyframes pop{from{opacity:0;transform:scale(.84)}to{opacity:1;transform:none}}
.pfreq{font-size:13px;color:var(--pink-d);background:var(--pink-xl);border:1px solid var(--pink-l);
  padding:4px 13px;border-radius:99px;animation:fade .5s ease both}
.psplit{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:8px}
.psplit b{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:#fff;border:1.5px solid var(--pink-l);border-radius:15px;padding:12px 16px;
  font-size:23px;font-weight:700;color:var(--pink-d);opacity:0;transform:translateY(12px);
  animation:rise .5s cubic-bezier(.2,.8,.3,1.2) forwards}
.psplit b i{font-style:normal;font-size:12.5px;font-weight:400;color:var(--txt2)}
.psplit b.rt{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 6px 18px rgba(194,112,140,.28)}
.psplit b.rt i{color:#fff;opacity:.92}
@keyframes rise{to{opacity:1;transform:none}}
.pchain{font-size:14px;color:var(--txt2);animation:fade .5s ease both;line-height:1.7}
.pstory{font-size:27px;line-height:1.85;font-weight:600;max-width:96%;min-height:3.4em;
  display:flex;align-items:center;justify-content:center;color:var(--txt);letter-spacing:.3px}
.pstory .cur{color:var(--pink);font-weight:400;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pmean{background:var(--ok-bg);border:2px solid var(--ok);color:#2F6B45;font-size:34px;font-weight:700;
  padding:16px 38px;border-radius:18px;animation:pop .45s cubic-bezier(.2,.8,.3,1.25);
  box-shadow:0 8px 22px rgba(94,158,114,.16);line-height:1.3}
.pfam{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-height:58vh;overflow:hidden}
.pfam span{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 11px;
  font-size:14px;color:var(--txt2);opacity:0;animation:drift .75s ease forwards}
.pfam span.on{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700;
  box-shadow:0 5px 14px rgba(194,112,140,.3)}
@keyframes drift{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pend{display:flex;flex-direction:column;align-items:center;gap:16px;animation:fade .5s ease}
.pendmsg{font-size:17px;line-height:1.9;font-weight:600}
.pendcta{font-size:13.5px;color:var(--pink-d);background:var(--pink-xl);border:1px solid var(--pink-l);
  border-radius:99px;padding:7px 16px}
.pctl{flex:none;display:flex;gap:8px;align-items:center;justify-content:center;padding-top:8px;flex-wrap:wrap}
.pctl button{background:#fff;border:1.5px solid var(--pink-l);color:var(--pink-d);border-radius:12px;
  padding:10px 13px;font-size:14px;cursor:pointer;font-family:inherit;transition:.16s;white-space:nowrap}
.pctl button.pri{background:var(--pink);border-color:var(--pink);color:#fff;min-width:88px;font-weight:600}
.pctl button:hover{transform:translateY(-1px)}
.pctl button.pri:hover{background:var(--pink-d)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="foot" id="foot">词根拆解 · 考研 5500 词</div>
<script>
"use strict";
var EPS = [];
/* ===== ep01_duc.js ===== */
EPS.push({
 id:"01",
 root:"duc / duct",
 mean:"引导",
 freq:122,
 sub:"拉丁 ducere（引导）· 全族 18 词 · 真题频次 122 次",
 story:{
  h3:"一根绳子的四种牵法",
  p:["想象手里牵着一根绳子，绳子这头是 <b>duc</b>（拉丁 ducere，引导）。你往哪牵，词就往哪长。",
     "这 18 个词其实是 9 把锁——produce 的钩子顺手就能带走 productivity。抓住牵绳子的方向，整族就通了。"],
  rope:[["往前牵 → produce","向 前 引 出 来 → 生产"],
        ["往回牵 → reduce","往 回 引 → 减少"],
        ["往里牵 → introduce","引 到 里 面 去 → 介绍"],
        ["往下牵 → deduce","向 下 引 出 结 论 → 推断"]]
 },
 next:"下一期：leg / lect / lig（挑 · 读 · 束）· 25 词 · 频次 92",
 words:[
 { w:"education", f:35, parts:[["e-","向外"],["duc","引导"],["-ation","名词"]], mean:"教育",
   opts:["教育","生产","减少","推断"],
   ask:"把一个人本来就有的光，一点点引导出来——意思是？",
   why:"e-（向外）+ duc（引导）+ -ation（名词）→ 把内在的东西引导出来 → <b>教育</b>。教育不是往脑子里灌东西，而是把一个人本来就有的光，一点点引导出来。",
   juan:[["e-（向外）+ duc（引导）→ 引导出来 → 教育",1],
         ["de-（向下）+ duc（引导）→ 往下引走 → 扣除",0],
         ["in-（向内）+ duc（引导）→ 引进去 → 诱导",0],
         ["re-（往回）+ duc（引导）→ 往回引 → 减少",0]] },

 { w:"product", f:17, parts:[["pro-","向前"],["duct","引导"]], mean:"产品",
   opts:["产品","生产","产量","生产率"],
   ask:"被一条流水线牵着手，送到你面前的东西——意思是？",
   why:"pro-（向前）+ duct（引导）→ 向前引导出来的东西 → <b>产品</b>。货架上每一件 product，都是被一条流水线牵着手，送到你面前的。",
   juan:[["pro-（向前）+ duct（引导）→ 向前引出来的东西 → 产品",1],
         ["re-（往回）+ duct（引导）→ 往回引 → 减少",0],
         ["con-（共同）+ duct（引导）→ 一起引 → 指挥",0],
         ["intro-（向内）+ duct（引导）→ 引进去 → 介绍",0]] },

 { w:"productivity", f:14, parts:[["pro-","向前"],["duct","引导"],["-ivity","能力"]], mean:"生产率",
   opts:["生产率","产品","产量","高产的"],
   ask:"手机锁进抽屉之后突然翻倍的那个东西——意思是？",
   why:"pro-（向前）+ duct（引导）+ -ivity（能力）→ 产出的能力 → <b>生产率</b>。同事把手机锁进抽屉的那一刻，她的 productivity 突然翻了一倍。",
   juan:[["pro-（向前）+ duct（引导）+ -ivity（能力）→ 产出的能力 → 生产率",1],
         ["pro-（向前）+ duct（引导）+ -ion（名词）→ 生产这个动作",0],
         ["pro-（向前）+ duct（引导）+ -ive（形容词）→ 高产的",0],
         ["pro-（向前）+ duct（引导）+ -er（人）→ 生产者",0]] },

 { w:"reduce", f:14, parts:[["re-","往回"],["duc","引导"]], mean:"减少、降低",
   opts:["减少、降低","扣除、减去","诱导、引起","推断、演绎"],
   ask:"把购物车里的东西往回引，越引越少——意思是？",
   why:"re-（往回）+ duc（引导）→ 往回引 → <b>减少、降低</b>。她终于学会把购物车里的东西 reduce 到三件——只留下真的会用到的。",
   juan:[["re-（往回）+ duc（引导）→ 往回引 → 减少",1],
         ["de-（去掉）+ duct（引导）→ 引走 → 扣除",0],
         ["in-（向内）+ duc（引导）→ 引进去 → 诱导",0],
         ["pro-（向前）+ duc（引导）→ 向前引出来 → 生产",0]] },

 { w:"produce", f:11, parts:[["pro-","向前"],["duc","引导"]], mean:"生产、制造",
   opts:["生产、制造","产品","介绍、引进","指挥、进行"],
   ask:"把东西从无到有引出来，工厂每天在做的动作——意思是？",
   why:"pro-（向前）+ duc（引导）→ 向前引出来 → <b>生产</b>。工厂 produce 出来的不只是零件，还有几百个人的一日三餐。",
   juan:[["pro-（向前）+ duc（引导）→ 向前引出来 → 生产",1],
         ["re-（往回）+ duc（引导）→ 往回引 → 减少",0],
         ["intro-（向内）+ duc（引导）→ 引进去 → 介绍",0],
         ["e-（向外）+ duc（引导）→ 引导出来 → 教育",0]] },

 { w:"conduct", f:7, parts:[["con-","共同"],["duct","引导"]], mean:"指挥；进行；举止",
   opts:["指挥；进行；举止","传导","介绍、引进","生产、制造"],
   ask:"带着一群人一起往前引导——意思是？",
   why:"con-（共同）+ duct（引导）→ 带着大家一起走 → <b>指挥、进行</b>。他站在乐队前 conduct 的时候，眼神像在牵引一整片海浪。",
   juan:[["con-（共同）+ duct（引导）→ 带着大家一起走 → 指挥 / 进行",1],
         ["pro-（向前）+ duct（引导）→ 向前引出来 → 生产",0],
         ["re-（往回）+ duct（引导）→ 往回引 → 减少",0],
         ["de-（去掉）+ duct（引导）→ 引走 → 扣除",0]] },

 { w:"introduce", f:7, parts:[["intro-","向内"],["duc","引导"]], mean:"介绍、引进",
   opts:["介绍、引进","诱导、引起","推断、演绎","扣除、减去"],
   ask:"把一个人引到另一个人的世界里去——意思是？",
   why:"intro-（向内）+ duc（引导）→ 引到里面去 → <b>介绍、引进</b>。她第一次把男朋友 introduce 给妈妈，手心全是汗。",
   juan:[["intro-（向内）+ duc（引导）→ 引到里面去 → 介绍 / 引进",1],
         ["pro-（向前）+ duc（引导）→ 向前引出来 → 生产",0],
         ["con-（共同）+ duc（引导）→ 一起引 → 指挥",0],
         ["in-（向内）+ duc（引导）→ 把念头引进去 → 诱导",0]] },

 { w:"educate", f:5, parts:[["e-","向外"],["duc","引导"],["-ate","动词"]], mean:"教育",
   opts:["教育","生产","减少","诱导"],
   ask:"把一个女孩内在的光引导出来——意思是？",
   why:"e-（向外）+ duc（引导）+ -ate（动词后缀）→ 引导出来 → <b>教育</b>。奶奶说，educate 一个女孩，就是 educate 一整个家。",

 story:{
  h3:"反过来：把「东西」和「样子」，都拧成一个动作",
  p:["前面九期都在把动作收成名词、形容词（-ment、-ion、-ity、-al、-able）。这一期反过来——<b>-ify</b>、<b>-ize</b>、<b>-ate</b> 是英语里的三个动词工厂，<b>名词和形容词进去，动词出来</b>：just（公正的）→ justify（证明…正当）、simple（简单的）→ simplify（使简单）、organ（机构）→ organize（组织起来）、active（活跃的）→ activate（使启动）。",
     "三个尾巴各有偏好：<b>-ify</b> 最爱接形容词（pure → purify、class → classify），<b>-ize</b> 最爱接名词（organ → organize、emphasis → emphasize），<b>-ate</b> 多是拉丁动词整套借来（activate、originate、estimate），常常拆不出熟词干——这一类靠记整词。",
     "⚠️ 拼写手术：<b>掉 e</b>——simple → simpl<b>ify</b>、pure → puri<b>fy</b>、ample → ampli<b>fy</b>、active → activ<b>ate</b>；<b>y 前面是辅音就直接加</b>——classify、justify、testify 都不用变；<b>-ize 还是 -ise</b>——organize（美式）／organise（英式）两种都对，阅读里遇到 -ise 别当错别字。",
     "⚠️ 最要留神的一件事：<b>这些词的意思常常不是字面拼出来的</b>。justify 不是「使公正」，是「证明…正当」；identify 不是「使同一」，是「认出、确认身份」；testify 跟「考试」一点关系都没有，是「作证」。看到 -ify 别急着按「使…」翻。",
     "🎯 后缀季收官，十期连起来就是一张词性转换地图：<b>-er/-or</b> 造人，<b>-ly</b> 造副词，<b>-ment/-ion/-ure/-ance/-ence/-ship/-hood/-age</b> 把动作收成名词，<b>-ity/-ness</b> 把形容词变成性质，<b>-al/-ic/-ous/-ive/-ful</b> 把名词变成形容词，而 <b>-ify/-ize/-ate</b> 把名词、形容词拧回动词。<b>认尾巴 → 猜词性 → 读懂长难句</b>，这条路就走通了。"],
  rope:[["just + -ify　证明…正当","-ify 接形容词：公正的 → 使显得正当"],
        ["organ + -ize　组织","-ize 接名词：机构 → 组织起来"],
        ["active + -ate　启动","-ate 多是拉丁动词整套来"],
        ["simple → simplify","⚠️ 掉 e 再加尾巴"]]
 },

var EP = null, FAM = {}, WORDS = [], RECALL = [], MIGRATE = [], ROOTS = [];
var QUESTS = [], TOTALQ = 0, NP = 0, NREC = 0, NMIG = 0;
var S = { phase:"home", chapter:"root", season:1, i:0, score:0, wrong:[], picked:{} };
var app = document.getElementById("app");

function shuffle(a){
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function buildQuests(){
  QUESTS = [];
  WORDS.forEach(function(w, i){ QUESTS.push({ kind:"word", wi:i }); });
  RECALL.forEach(function(r){ QUESTS.push({ kind:"recall", d:r }); });
  MIGRATE.forEach(function(m){ QUESTS.push({ kind:"migrate", d:m }); });
  TOTALQ = QUESTS.length;
}
function loadEP(idx){
  EP = EPS[idx];
  FAM = { root:EP.root, mean:EP.mean, freq:EP.freq };
  WORDS = EP.words; RECALL = EP.recall; MIGRATE = EP.migrate;
  NP = WORDS.length; NREC = RECALL.length; NMIG = MIGRATE.length;
  ROOTS = EP.root.split("/").map(function(x){ return x.trim(); });
  buildQuests();
  document.title = "词根拆解 · " + EP.root + "（" + EP.mean + "）· 第 " + EP.id + " 期";
  var f = document.getElementById("foot");
  if (f) f.innerHTML = "词根拆解 · <b>" + esc(EP.root) + "</b>（" + esc(EP.mean) + "）· 第 " + EP.id + " 期 · 真题频次 " + EP.freq + " 次";
}
function resetRun(){
  WORDS.forEach(function(w){ w.cache = null; w.jcache = null; });
  RECALL.forEach(function(r){ r.cache = null; });
  MIGRATE.forEach(function(m){ m.cache = null; });
  S.i = 0; S.score = 0; S.wrong = []; S.picked = {};
}

/* ================= 目录 ================= */
function render(){
  if (S.phase === "home"){ renderHome(); return; }
  if (S.phase === "intro"){ renderIntro(); return; }
  renderQ();
}
var SEASON_NAME = { 1:"第一季", 2:"第二季", 3:"第三季", 4:"第四季", 5:"第五季" };
var AFFIX_SEASON_NAME = { 1:"后缀季", 2:"前缀季" };
function chapOf(e){ return e.chapter || "root"; }
function seasonName(ch, se){
  if (ch === "affix") return AFFIX_SEASON_NAME[se] || ("第 " + se + " 季");
  return SEASON_NAME[se] || ("第 " + se + " 季");
}
function renderHome(){
  var CH = S.chapter || "root";
  var pool = EPS.filter(function(e){ return chapOf(e) === CH; });
  var maxSeason = 1;
  pool.forEach(function(e){ var se = e.season || 1; if (se > maxSeason) maxSeason = se; });
  var maxAll = 1;
  EPS.forEach(function(e){ var se = e.season || 1; if (se > maxAll) maxAll = se; });
  var tabMax = (CH === "affix") ? Math.max(1, maxSeason) : Math.max(5, maxAll);
  if (!pool.some(function(e){ return (e.season || 1) === S.season; })){
    S.season = pool.length ? (pool[0].season || 1) : 1;
  }
  var s = "";
  s += '<div class="center">';
  s += '<div class="intro-kicker">' + (CH === "affix" ? "词 缀 拆 解" : "词 根 拆 解") + '</div>';
  s += '<div class="intro-h1">考研 5500 词</div>';
  s += '<div class="intro-sub">' + (CH === "affix"
       ? "51 个常用词缀 · 已上线 " + pool.length + " 期"
       : "186 个词根家族 · 已上线 " + pool.length + " 期") + '</div>';
  s += '</div>';
  var nRoot = EPS.filter(function(e){ return chapOf(e) === "root"; }).length;
  var nAff = EPS.filter(function(e){ return chapOf(e) === "affix"; }).length;
  s += '<div class="chapters">';
  s += '<button class="ctab' + (CH === "root" ? ' on' : '') + (nRoot ? '' : ' off') + '" data-chap="root">词根篇</button>';
  s += '<button class="ctab' + (CH === "affix" ? ' on' : '') + (nAff ? '' : ' off') + '" data-chap="affix">词缀篇</button>';
  s += '</div>';
  s += '<div class="chap-note">' + (CH === "affix" ? "后缀定词性 · 前缀定方向" : "一个家族一串词 · 按真题频次排") + '</div>';
  s += '<div class="intro-card"><h3>' + (CH === "affix" ? "看尾巴，看脑袋" : "先看一遍，再做一遍") + '</h3>';
  if (CH === "affix"){
    s += '<p>每一期拆一个词缀（或一族近义词缀）。<b>▶ 先看一遍</b>是像视频那样自动播给你看；<b>✍️ 开始闯关</b>是自己动手做。</p>';
    s += '<p>后缀告诉你<b>这是什么词性</b>，前缀告诉你<b>往哪个方向</b>——认出一个词缀，就是认出一串词。</p>';
  } else {
    s += '<p>每一期拆一个词根家族。<b>▶ 先看一遍</b>是像视频那样自动播给你看；<b>✍️ 开始闯关</b>是自己动手做。</p>';
    s += '<p>按真题频次从高到低排——越靠前，考到的次数越多。</p>';
  }
  s += '</div>';
  // 季 Tab：按当前篇章显示（词根篇＝第一季～第五季；词缀篇＝后缀季／前缀季）
  s += '<div class="seasons">';
  for (var se = 1; se <= tabMax; se++){
    var hasSe = pool.some(function(e){ return (e.season || 1) === se; });
    s += '<button class="stab' + (S.season === se ? ' on' : '') + (hasSe ? '' : ' off') + '" data-season="' + se + '">' +
         seasonName(CH, se) + '</button>';
  }
  s += '</div>';
  // 当前季的期列表
  var list = [], tw = 0, tf = 0;
  EPS.forEach(function(e, i){
    if (chapOf(e) === CH && (e.season || 1) === S.season){ list.push(i); tw += e.words.length; tf += e.freq; }
  });
  if (list.length){
    s += '<div class="season-sum">' + seasonName(CH, S.season) + ' · ' + list.length + ' 期 · ' + tw + ' 词形 · 真题命中 ' + tf + ' 次</div>';
    list.forEach(function(i){
      var e = EPS[i];
      s += '<div class="epcard" data-ep="' + i + '">';
      s += '<div class="epcard-l">';
      s += '<div class="epcard-no">' + (e.tag || ('第 ' + e.id + ' 期')) + '　·　真题频次 ' + e.freq + ' 次</div>';
      s += '<div class="epcard-root">' + esc(e.root) + '</div>';
      s += '<div class="epcard-mean">' + esc(e.mean) + '</div>';
      s += '</div>';
      s += '<div class="epcard-r"><b>' + e.words.length + '</b>词　拆解<br>' + e.words.length + ' 题</div>';
      s += '</div>';
    });
  } else {
    s += '<p style="text-align:center;color:#8A7A81;font-size:13.5px;margin:34px 0">这一季还在路上 · 敬请期待 ✨</p>';
  }
  s += '<p style="font-size:12.5px;color:#8A7A81;text-align:center;margin:20px 0 0">' +
       '词根词缀法 · 内容来自考研英语 5500 词真题母库</p>';
  app.innerHTML = s;
  document.getElementById("foot").innerHTML = "词根拆解 · 考研 5500 词 · 已上线 " + EPS.length + " 期";
  Array.prototype.forEach.call(app.querySelectorAll(".ctab"), function(el){
    el.onclick = function(){
      var ch = el.getAttribute("data-chap");
      if (!EPS.some(function(e){ return chapOf(e) === ch; })) return;
      S.chapter = ch; S.season = 1; renderHome();
    };
  });
  Array.prototype.forEach.call(app.querySelectorAll(".stab"), function(el){
    el.onclick = function(){
      var se = Number(el.getAttribute("data-season"));
      var hasSe = pool.some(function(e){ return (e.season || 1) === se; });
      if (!hasSe) return;
      S.season = se;
      renderHome();
    };
  });
  Array.prototype.forEach.call(app.querySelectorAll(".epcard"), function(el){
    el.onclick = function(){
      loadEP(Number(el.getAttribute("data-ep")));
      resetRun();
      S.phase = "intro";
      render();
    };
  });
}

/* ================= 章节导航 ================= */
function jumpEP(idx){
  loadEP(idx); resetRun(); S.phase = "intro"; render();
}
function chnavHTML(){
  var i = EPS.indexOf(EP);
  var s = '<div class="chnav">';
  s += '<button class="cnav-btn" id="cprev"' + (i > 0 ? '' : ' disabled') + '>← 上一期</button>';
  s += '<span class="cur">' + (EP.tag ? EP.tag : ('第 ' + EP.id + ' 期')) + ' · ' + esc(EP.root) + '</span>';
  s += '<button class="cnav-btn" id="cnext"' + (i < EPS.length - 1 ? '' : ' disabled') + '>下一期 →</button>';
  s += '</div>';
  return s;
}
function bindChnav(){
  var i = EPS.indexOf(EP);
  var p = document.getElementById("cprev"), n = document.getElementById("cnext");
  if (p) p.onclick = function(){ if (i > 0) jumpEP(i - 1); };
  if (n) n.onclick = function(){ if (i < EPS.length - 1) jumpEP(i + 1); };
}

/* ================= 本期开场 ================= */
function renderIntro(){
  var s = "";
  s += chnavHTML();
  s += '<div class="center">';
  s += '<div class="intro-kicker">词 根 拆 解 · 第 ' + EP.id + ' 期</div>';
  s += '<div class="intro-h1">' + esc(EP.root) + '</div>';
  s += '<div class="intro-sub">' + esc(EP.sub) + '</div>';
  s += '</div>';
  s += '<div class="intro-card"><h3>' + esc(EP.story.h3) + '</h3>';
  EP.story.p.forEach(function(t){ s += '<p>' + t + '</p>'; });
  s += '<div class="rope">';
  EP.story.rope.forEach(function(r){
    s += '<div' + (r[2] ? ' class="wide"' : '') + '><b>' + r[0] + '</b>' + r[1] + '</div>';
  });
  s += '</div></div>';
  s += '<div class="intro-card"><h3>这一期你要做的</h3>';
  s += '<p>' + NP + ' 个族内词（按真题频次从高到低）+ ' + NREC + ' 题重点词回顾 + ' + NMIG + ' 题迁移辨析，共 ' + TOTALQ + ' 题。</p>';
  s += '<p>每题先答拆解，答完还有一刀「趁热一刀」——不计分，但那一刀才是真的记住。</p></div>';
  s += '<button class="btn" id="play">▶ 先看一遍（像视频那样自动播）</button>';
  s += '<button class="btn ghost" id="go">✍️ 直接开始闯关（做题）</button>';
  s += '<button class="btn ghost" id="home">← 回到期目录</button>';
  app.innerHTML = s;
  bindChnav();
  document.getElementById("go").onclick = function(){ resetRun(); S.phase = "quiz"; render(); };
  document.getElementById("play").onclick = playBoot;
  document.getElementById("home").onclick = function(){ S.phase = "home"; render(); };
}

/* ================= ▶ 演播模式：纯字幕，无人声 ================= */
var ACTNAME = ["word","split","story","mean","family"];
var ACTMS = { word:900, split:2000, story:3600, mean:1700, family:2400 };
var P = { wi:0, act:0, t:null, typer:null, speed:1, paused:false, sound:false };

function playClear(){
  if (P.t){ clearTimeout(P.t); P.t = null; }
  if (P.typer){ clearInterval(P.typer); P.typer = null; }
}
function playSchedule(ms){
  if (P.t) clearTimeout(P.t);
  P.t = setTimeout(playStep, ms / P.speed);
}
function playStep(){
  P.act++;
  if (P.act >= ACTNAME.length){ P.act = 0; P.wi++; }
  playRender();
  if (P.wi < WORDS.length) playSchedule(ACTMS[ACTNAME[P.act]]);
}
function playBoot(){
  playClear();
  P.wi = 0; P.act = 0; P.paused = false; P.sound = false;
  if (document.getElementById("pw")) document.getElementById("pw").remove();
  document.body.classList.add("playing");
  document.body.insertAdjacentHTML("beforeend",
    '<div class="pw" id="pw">' +
      '<div class="pw-top"><span id="ptag"></span><span id="pnum"></span></div>' +
      '<div class="pw-prog"><i id="pbar"></i></div>' +
      '<div class="pstage" id="pstage"></div>' +
      '<div class="pctl">' +
        '<button id="pprev">◀ 上一词</button>' +
        '<button class="pri" id="ppause">暂停</button>' +
        '<button id="pnext">下一词 ▶</button>' +
        '<button id="pspeed">1×</button>' +
        '<button id="psound">🔇</button>' +
        '<button id="pexit">✕</button>' +
      '</div>' +
    '</div>');
  document.getElementById("ppause").onclick = playToggle;
  document.getElementById("pprev").onclick = function(){
    playClear(); P.act = 0; P.wi = Math.max(0, P.wi - 1); playRender(); playSchedule(ACTMS.word);
  };
  document.getElementById("pnext").onclick = function(){
    playClear(); P.act = 0; P.wi++; playRender();
    if (P.wi < WORDS.length) playSchedule(ACTMS.word);
  };
  document.getElementById("pspeed").onclick = function(){
    P.speed = P.speed === 1 ? 1.6 : 1;
    this.textContent = P.speed === 1 ? "1×" : "1.6×";
  };
  document.getElementById("psound").onclick = function(){
    P.sound = !P.sound;
    this.textContent = P.sound ? "🔊" : "🔇";
  };
  document.getElementById("pexit").onclick = function(){ playClose(); S.phase = "intro"; render(); };
  playRender();
  playSchedule(ACTMS.word);
}
function playClose(){
  playClear(); P.paused = false;
  if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch(e){} }
  var el = document.getElementById("pw"); if (el) el.remove();
  document.body.classList.remove("playing");
}
function playToggle(){
  var b = document.getElementById("ppause");
  if (P.paused){
    P.paused = false; b.textContent = "暂停";
    playSchedule(ACTMS[ACTNAME[P.act]] * 0.5);
  } else {
    P.paused = true; b.textContent = "继续"; playClear();
  }
}
function speakWord(t){
  if (!P.sound || !window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t);
    u.lang = "en-US"; u.rate = 0.88;
    window.speechSynthesis.speak(u);
  } catch(e){}
}
function playType(txt){
  var el = document.getElementById("pstory");
  if (!el) return;
  var i = 0;
  P.typer = setInterval(function(){
    i++;
    if (i >= txt.length){
      clearInterval(P.typer); P.typer = null;
      el.textContent = txt;
      return;
    }
    el.innerHTML = esc(txt.slice(0, i)) + '<span class="cur">|</span>';
  }, 50 / P.speed);
}
function playRender(){
  playClear();
  var st = document.getElementById("pstage");
  if (!st) return;
  document.getElementById("ptag").textContent = "词根拆解 · " + EP.root + "（" + EP.mean + "）";
  var num = document.getElementById("pnum");
  var bar = document.getElementById("pbar");
  if (P.wi >= WORDS.length){
    num.textContent = "完";
    bar.style.width = "100%";
    playOutro();
    return;
  }
  var w = WORDS[P.wi], act = ACTNAME[P.act];
  num.textContent = ("0" + (P.wi + 1)).slice(-2) + " / " + WORDS.length;
  bar.style.width = Math.round((P.wi * ACTNAME.length + P.act) / (WORDS.length * ACTNAME.length) * 100) + "%";

  if (act === "word"){
    st.innerHTML = '<div class="pword">' + esc(w.w) + '</div>' +
      '<div class="pfreq">真题频次 ' + w.f + ' 次</div>';
    speakWord(w.w);
    return;
  }
  if (act === "split"){
    var h = "";
    w.parts.forEach(function(p, i){
      var bare = p[0].replace(/-/g, "");
      var isRoot = ROOTS.some(function(r){ var rb = String(r).replace(/-/g, ""); return bare === rb || bare.indexOf(rb) >= 0; });
      h += '<b class="' + (isRoot ? "rt" : "") + '" style="animation-delay:' + (i * 300) + 'ms">' +
           esc(p[0]) + '<i>' + esc(p[1]) + '</i></b>';
    });
    st.innerHTML = '<div class="psplit">' + h + '</div>';
    return;
  }
  if (act === "story"){
    st.innerHTML = '<div class="pstory" id="pstory"></div>';
    playType(String(w.ask).replace(/——意思是？$/, "").replace(/——意思是\?$/, ""));
    return;
  }
  if (act === "mean"){
    st.innerHTML = '<div class="pmean">' + esc(w.mean) + '</div>' +
      '<div class="pchain">' + w.parts.map(function(p){ return esc(p[0]) + "（" + esc(p[1]) + "）"; }).join(" ＋ ") + '</div>';
    return;
  }
  var fam = WORDS.map(function(x, i){
    return '<span class="' + (i === P.wi ? "on" : "") + '" style="animation-delay:' + (i * 60) + 'ms">' + esc(x.w) + '</span>';
  }).join("");
  st.innerHTML = '<div class="pword" style="font-size:30px;animation:none">' +
    w.parts.map(function(p){ return esc(p[0]); }).join("") + '</div>' +
    '<div class="pfam">' + fam + '</div>';
}
function playOutro(){
  var st = document.getElementById("pstage");
  var fam = WORDS.map(function(x, i){
    return '<span style="animation-delay:' + (i * 55) + 'ms">' + esc(x.w) +
      '<i style="font-style:normal;opacity:.6;font-size:11px;margin-left:4px">' + x.f + '</i></span>';
  }).join("");
  st.innerHTML = '<div class="pend">' +
    '<div class="pword" style="font-size:28px">' + esc(EP.root) + '　' + esc(EP.mean) + '</div>' +
    '<div class="pfam">' + fam + '</div>' +
    '<div class="pendmsg">词汇的钥匙，其实就那么几把。<br>抓住一把，能开一整串门。</div>' +
    '<div class="pendcta">关注我 · 一个词根一个词根，拆给你看</div>' +
    '<div class="pctl" style="padding-top:4px">' +
      '<button class="pri" id="pagain">重看一遍</button>' +
      '<button id="pquiz">✍️ 去闯关</button>' +
      '<button id="phome">← 期目录</button>' +
    '</div></div>';
  document.getElementById("pagain").onclick = playBoot;
  document.getElementById("pquiz").onclick = function(){
    playClose(); resetRun(); S.phase = "quiz"; render();
  };
  document.getElementById("phome").onclick = function(){
    playClose(); S.phase = "home"; render();
  };
}

/* ================= 答题 ================= */
function stageName(i){
  if (i < NP) return "拆解主问";
  if (i < NP + NREC) return "重点词回顾";
  return "迁移辨析";
}
function head(){
  var s = "";
  var ei = EPS.indexOf(EP);
  s += '<div class="topbar">';
  s += '<div class="tleft"><span class="back" id="backhome" title="回目录">←</span>';
  s += '<span class="back" id="eprev" title="上一期"' + (ei > 0 ? '' : ' style="opacity:.35"') + '>‹</span>';
  s += '<span class="back" id="epnext" title="下一期"' + (ei < EPS.length - 1 ? '' : ' style="opacity:.35"') + '>›</span>';
  s += '<span class="badge">第 ' + EP.id + ' 期　' + esc(EP.root) + '（' + esc(EP.mean) + '）</span></div>';
  s += '<span class="counter">第 ' + Math.min(S.i + 1, TOTALQ) + ' / ' + TOTALQ + ' 题 · ' + stageName(Math.min(S.i, TOTALQ - 1)) + '</span>';
  s += '</div>';
  s += '<div class="bar"><i style="width:' + Math.round(S.i / TOTALQ * 100) + '%"></i></div>';
  return s;
}
function bindHead(){
  var bh = document.getElementById("backhome");
  if (bh) bh.onclick = function(){ S.phase = "home"; render(); };
  var ei = EPS.indexOf(EP);
  var p = document.getElementById("eprev"), n = document.getElementById("epnext");
  if (p) p.onclick = function(){ if (ei > 0) jumpEP(ei - 1); };
  if (n) n.onclick = function(){ if (ei < EPS.length - 1) jumpEP(ei + 1); };
}
function nextQ(){
  S.picked = {};
  var wasWord = QUESTS[S.i].kind === "word";
  S.i++;
  if (wasWord && S.i === NP){
    app.innerHTML = '<div class="seg"><div class="ico">🌸</div><h2>' + NP + ' 个族内词，拆完了</h2>' +
      '<p>下面 ' + NREC + ' 题把最高频的几个词再捞一遍——<br>这次不给你拆解式，直接看画面选词。</p>' +
      '<button class="btn" id="nx">进入重点词回顾</button></div>';
    document.getElementById("nx").onclick = render;
    return;
  }
  if (S.i === NP + NREC){
    app.innerHTML = '<div class="seg"><div class="ico">🧭</div><h2>换个角度再切一刀</h2>' +
      '<p>最后 ' + NMIG + ' 题是迁移辨析：<br>把 ' + esc(EP.root) + ' 放进一堆长得像的词里，看你还认不认得出来。</p>' +
      '<button class="btn" id="nx">进入迁移辨析</button></div>';
    document.getElementById("nx").onclick = render;
    return;
  }
  if (S.i >= TOTALQ){ renderResult(); return; }
  render();
}

function renderQ(){
  var q = QUESTS[S.i];
  var s = head();
  if (q.kind === "word"){
    var word = WORDS[q.wi];
    var chain = word.parts.map(function(p){ return p[0] + "（" + p[1] + "）"; }).join(" + ");
    s += '<div class="qbig"><span class="eq">' + word.w + '</span> = ' + chain +
         '<span class="cn">' + esc(word.ask) + '</span></div>';
    s += '<div class="speak" data-speak="' + word.w + '"><span>🔊</span>听这个词</div>';
    s += '<div class="opts" id="opts" style="margin-top:14px">';
    if (!word.cache) word.cache = shuffle(word.opts.map(function(t){ return { t:t, ok: t === word.mean ? 1 : 0 }; }));
    word.cache.forEach(function(o){
      s += '<div class="opt" data-ok="' + o.ok + '">' + esc(o.t) + '</div>';
    });
    s += '</div>';
  } else {
    var d = q.d;
    s += '<div class="qmid">' + d.ask + '</div>';
    s += '<div class="opts" id="opts">';
    if (!d.cache) d.cache = shuffle(d.opts.map(function(t){ return { t:t, ok: t === d.truth ? 1 : 0 }; }));
    d.cache.forEach(function(o){
      s += '<div class="opt" data-ok="' + o.ok + '">' + esc(o.t) + '</div>';
    });
    s += '</div>';
  }
  s += '<div id="after"></div>';
  app.innerHTML = s;
  bindHead();
  bindOpts();
  bindSpeak();
}

function bindOpts(){
  var box = document.getElementById("opts");
  if (!box) return;
  Array.prototype.forEach.call(box.querySelectorAll(".opt"), function(el){
    el.onclick = function(){
      if (S.picked.main) return;
      S.picked.main = true;
      var q = QUESTS[S.i];
      var word = q.kind === "word" ? WORDS[q.wi] : null;
      var right = el.getAttribute("data-ok") === "1";
      Array.prototype.forEach.call(box.querySelectorAll(".opt"), function(x){
        if (x.getAttribute("data-ok") === "1") x.classList.add("ok");
        else if (x === el) x.classList.add("no");
        else x.classList.add("dim");
      });
      if (right) S.score++;
      else S.wrong.push({ label: word ? word.w : q.d.truth, right: word ? word.mean : q.d.truth });
      var after = document.getElementById("after");
      var chunks = '<div class="why">💡 ' + (word ? word.why : q.d.why) + '</div>';
      if (word){
        chunks += '<div class="juan"><span class="jtag">趁热一刀 · 不计分</span>' +
                  '<div class="qmid">「' + word.w + '」这个词的钩子是哪一条？</div><div class="opts" id="jopts">';
        if (!word.jcache) word.jcache = shuffle(word.juan.map(function(p){ return { t:p[0], ok:p[1] }; }));
        word.jcache.forEach(function(o){ chunks += '<div class="opt" data-ok="' + o.ok + '">' + esc(o.t) + '</div>'; });
        chunks += '</div></div>';
      }
      chunks += '<button class="btn" id="nx">' + (S.i + 1 >= TOTALQ ? "看成绩" : "下一题") + '</button>';
      after.innerHTML = chunks;
      if (word) bindJuan();
      document.getElementById("nx").onclick = nextQ;
      after.scrollIntoView({ behavior:"smooth", block:"nearest" });
    };
  });
}
function bindJuan(){
  var box = document.getElementById("jopts");
  if (!box) return;
  Array.prototype.forEach.call(box.querySelectorAll(".opt"), function(el){
    el.onclick = function(){
      if (S.picked.juan) return;
      S.picked.juan = true;
      Array.prototype.forEach.call(box.querySelectorAll(".opt"), function(x){
        if (x.getAttribute("data-ok") === "1") x.classList.add("ok");
        else if (x === el) x.classList.add("no");
        else x.classList.add("dim");
      });
    };
  });
}
function bindSpeak(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-speak]"), function(el){
    el.onclick = function(){
      var w = el.getAttribute("data-speak");
      if (!window.speechSynthesis) return;
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(w);
        u.lang = "en-US"; u.rate = 0.9;
        window.speechSynthesis.speak(u);
      } catch(e){}
    };
  });
}

function renderResult(){
  var pc = Math.round(S.score / TOTALQ * 100);
  var lv = pc >= 90 ? "这一族归你了" : pc >= 75 ? "上手了" : pc >= 60 ? "记住了半根" : "再拆一遍";
  var s = head();
  s += '<div class="center" style="margin-top:10px">';
  s += '<div class="intro-kicker">本 期 成 绩</div>';
  s += '<div class="intro-h1">' + S.score + ' / ' + TOTALQ + '</div>';
  s += '<div class="intro-sub">正确率 ' + pc + '% · ' + lv + '</div>';
  s += '</div>';
  s += '<div class="stats">';
  s += '<div class="stat"><div class="n">' + NP + '</div><div class="k">族内词拆解</div></div>';
  s += '<div class="stat"><div class="n">' + NREC + '</div><div class="k">重点词回顾</div></div>';
  s += '<div class="stat"><div class="n">' + NMIG + '</div><div class="k">迁移辨析</div></div>';
  s += '<div class="stat"><div class="n">' + FAM.freq + '</div><div class="k">全族真题频次</div></div>';
  s += '</div>';
  if (S.wrong.length){
    s += '<div class="intro-card"><h3>这几个再牵一遍</h3><p style="font-size:14.5px">' +
      S.wrong.map(function(x){ return esc(x.label) + ' → ' + esc(x.right); }).join("<br>") + '</p></div>';
  } else {
    s += '<div class="intro-card"><h3>一个没漏</h3><p>' + NP + ' 个词全部接住，这族的真题频次你已经全拿到手。</p></div>';
  }
  s += '<div class="intro-card"><h3>本期 ' + NP + ' 词（按真题频次）</h3><div class="wlist">' +
    WORDS.map(function(w){ return '<span>' + esc(w.w) + '<i>' + w.f + '</i></span>'; }).join("") +
    '</div></div>';
  if (EP.next) s += '<p style="font-size:13px;color:#8A7A81;text-align:center;margin:18px 0 0">' + esc(EP.next) + '</p>';
  var ei = EPS.indexOf(EP);
  if (ei < EPS.length - 1){
    s += '<button class="btn" id="nexp">下一期 →　第 ' + EPS[ei + 1].id + ' 期 · ' + esc(EPS[ei + 1].root) + '</button>';
  }
  s += '<button class="btn ghost" id="again">重做一遍</button>';
  s += '<button class="btn ghost" id="home">← 回到期目录</button>';
  app.innerHTML = s;
  bindHead();
  var nx = document.getElementById("nexp");
  if (nx) nx.onclick = function(){ jumpEP(ei + 1); };
  document.getElementById("again").onclick = function(){ resetRun(); render(); };
  document.getElementById("home").onclick = function(){ S.phase = "home"; render(); };
}

render();
</script>
</body>
</html>
