<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#EDEAE0}
body{color:#22302B;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.75;display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:520px;background:#FAF8F3;min-height:100vh;padding:0 0 30px;position:relative;

#hud{position:sticky;top:0;z-index:20;background:#1F3D33;color:#EFEDE3;padding:9px 14px 10px}
#hud .row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.5px}
#hud .sec{color:#D9C9A8}
#hud .step{color:#C9C2AE}
#hud .track{height:4px;background:#3A5A4E;border-radius:3px;margin-top:8px;overflow:hidden}
#hud .fill{height:100%;background:#D9C9A8;border-radius:3px;transition:width .35s}

.screen{padding:26px 22px 10px}
h1{font-size:23px;font-weight:900;letter-spacing:1.5px;color:#1F3D33;line-height:1.45}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.5px;border-radius:5px;padding:3px 9px;margin-bottom:12px}
.t-ch{background:#E8F0EC;color:#2E5947}
.t-fork{background:#FBEFE6;color:#9C5230}
.t-mid{background:#F0EDE2;color:#7A7357}
.stamp{display:inline-block;border:3px solid #A8442C;color:#A8442C;border-radius:9px;padding:9px 18px;

.lead{font-size:14px;color:#5C6A64;line-height:1.95;margin-bottom:16px}
.lead i{font-style:normal;color:#2E5947;font-weight:800}
.hint{font-size:12px;color:#9AA6A1;line-height:1.85}

.btn{display:block;width:100%;border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:800;
  padding:14px 16px;cursor:pointer;text-align:center;letter-spacing:.5px}
.btn.main{background:#2E5947;color:#fff;box-shadow:0 3px 0 #1F4436}
.btn.main:active{transform:translateY(2px);box-shadow:0 1px 0 #1F4436}
.btn.ghost{background:#fff;border:1.5px solid #DDD8C9;color:#3B4A44;font-size:14px}
.btn.ghost:active{background:#F4F1E8}

.card{background:#fff;border:1px solid #E4E0D5;border-radius:14px;padding:16px;margin-bottom:12px}
.card .k{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#2E5947;margin-bottom:6px}
.card .v{font-size:15px;font-weight:800;color:#1F3D33;line-height:1.6}
.card .d{font-size:12.5px;color:#6E7B75;margin-top:5px;line-height:1.8}
.scene{font-size:15.5px;line-height:1.95;color:#2B3A34;margin-bottom:16px;font-weight:500}
.scene i{font-style:normal;color:#2E5947;font-weight:700}

.opt{background:#fff;border:1.5px solid #E4E0D5;border-radius:12px;padding:13px 15px;margin-bottom:9px;
  cursor:pointer;display:flex;gap:11px;align-items:flex-start;transition:border-color .12s,background .12s,opacity .25s}
.opt:active{transform:scale(.995)}
.opt .idx{width:22px;height:22px;flex:none;border-radius:50%;background:#F1EFE7;color:#7A7357;
  font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:2px}
.opt .tx{font-size:14.5px;font-weight:700;color:#22302B;line-height:1.65}
.opt .tx .sub{display:block;font-size:12.5px;font-weight:500;color:#7D8A84;margin-top:3px;line-height:1.7}
.opt:hover{border-color:#C9C2AE}
.opt.picked{border-color:#2E5947;background:#EFF5F1}
.opt.picked .idx{background:#2E5947;color:#fff}
.opt.dim{opacity:.45}

/* 返回上一题 */
.qback{display:inline-block;font-size:12px;font-weight:700;color:#8B978F;letter-spacing:.5px;
  padding:4px 10px 4px 0;margin-bottom:8px;cursor:pointer}
.qback:active{color:#2E5947}

.chapter{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;
  text-align:center;padding:40px 26px}
.chapter .cn{font-size:13px;font-weight:800;letter-spacing:4px;color:#2E5947;margin-bottom:8px}
.chapter .ct{font-size:24px;font-weight:900;color:#1F3D33;letter-spacing:1px;margin-bottom:6px}
.chapter .cs{font-size:13px;color:#7D8A84;letter-spacing:1px}
.chapter .cd{font-size:13.5px;color:#5C6A64;line-height:1.9;margin-top:16px}
.chapter .btn{margin-top:30px}

.endwrap{padding:22px 20px 10px}
.endtitle{text-align:center;margin-bottom:6px}
.endtitle .st{font-size:11.5px;font-weight:800;letter-spacing:3px;color:#9AA6A1}
.endtitle .en{font-size:28px;font-weight:900;color:#1F3D33;letter-spacing:2px;margin:6px 0 4px}
.endtitle .ec{font-size:12.5px;color:#2E5947;font-weight:800;letter-spacing:.5px}

/* ===== 结果页页内导航 ===== */
.rnav{position:sticky;top:0;z-index:30;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  margin:12px -20px 2px;padding:7px 20px 8px;
  background:rgba(250,248,243,.97);border-bottom:1px solid #EDE7D8}
.rnav::-webkit-scrollbar{display:none}
.rnav b{flex:none;display:inline-flex;align-items:center;min-height:30px;
  font-size:11.5px;font-weight:800;color:#3B4A44;letter-spacing:.2px;line-height:1.2;
  background:#fff;border:1px solid #E0DACB;border-radius:16px;padding:0 12px;cursor:pointer;
  white-space:nowrap;transition:background .12s,color .12s}
.rnav b:active,.rnav b.on{background:#2E5947;color:#fff;border-color:#2E5947}
#rsecTop,#rsecToday,#rsecGuide,#rsecPmts,#rsecPlan{scroll-margin-top:58px}
.verdict{border:1.5px dashed #D3C39E;border-radius:12px;padding:14px 16px;margin:16px 0 18px;text-align:center;
  font-size:15px;font-weight:800;color:#7A5A33;line-height:1.85;background:#FBF6EA}
.dossier{background:#fff;border:1px solid #E4E0D5;border-radius:14px;padding:16px;margin-bottom:12px}
.dossier .dt{font-size:11.5px;font-weight:800;letter-spacing:2px;color:#2E5947;margin-bottom:10px}
.dbar{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:8px}
.dbar .nm{width:88px;color:#5C6A64;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar .track{flex:1;height:7px;background:#F1EFE7;border-radius:4px;overflow:hidden}
.dbar .fill{display:block;height:100%;background:#9DB4A6;border-radius:4px}
.dbar .fill.hot{background:#2E5947}
.dbar .v{width:36px;text-align:right;font-weight:800;color:#1F3D33;font-variant-numeric:tabular-nums}
.dmeta{font-size:12.5px;color:#6E7B75;line-height:1.9;margin-top:10px;padding-top:10px;border-top:1px dashed #E7E2D4}
.dmeta b{color:#1F3D33}
.dmeta .warn{color:#A33B3B;font-weight:700}
.share{background:#1F3D33;color:#EFEDE3;border-radius:14px;padding:16px;margin-bottom:12px}
.share .st{font-size:13.5px;font-weight:800;margin-bottom:8px;letter-spacing:.5px}
.share .sx{font-size:12.5px;color:#C9C2AE;line-height:1.85;margin-bottom:12px}
.share button{width:100%;border:none;border-radius:10px;background:#D9C9A8;color:#1F3D33;font-family:inherit;
  font-size:13.5px;font-weight:900;padding:11px;min-height:44px;cursor:pointer}

/* ===== 三条推荐 ===== */
.tri{background:#fff;border:1px solid #E4E0D5;border-radius:14px;padding:0;margin-bottom:12px;overflow:hidden}
.tri.first{border-color:rgba(46,89,71,.45);box-shadow:0 2px 12px rgba(46,89,71,.10)}
.tri .hd{display:flex;align-items:center;gap:10px;padding:13px 16px;background:#F7F4EC}
.tri.first .hd{background:#2E5947}
.tri .no{width:24px;height:24px;flex:none;border-radius:50%;background:#2E5947;color:#fff;
  font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.tri.first .no{background:#fff;color:#2E5947}
.tri .nm{flex:1;font-size:15px;font-weight:900;color:#1F3D33;letter-spacing:.5px;line-height:1.4}
.tri.first .nm{color:#fff}
.tri .no2{font-size:11.5px;font-weight:800;color:#8D7A5E;white-space:nowrap}
.tri.first .no2{color:#D8E4DC}
.tri .bd{padding:14px 16px 4px}
.tri .why{font-size:13.5px;color:#3B4A44;line-height:1.9;margin-bottom:12px}
.tri .why em{font-style:normal;background:#EAF1EB;color:#2E5947;font-weight:800;padding:0 3px;border-radius:3px}
.tri .kv{display:flex;gap:9px;font-size:12.5px;line-height:1.8;margin-bottom:9px}
.tri .kv .k{flex:none;width:56px;color:#9AA6A1;font-weight:700;letter-spacing:.5px}
.tri .kv .v{flex:1;color:#4A5A54}
.tri .kv .v b{color:#1F3D33}
.tri .kv.risk .v{color:#8A4A32}
.tri .kv.fit .v{color:#2E5947;font-weight:600}
.tri .kv.avoid .k,.tri .kv.avoid .v{color:#9C5230}
.tri .kv .dots{letter-spacing:1.5px;font-size:10px;color:#D5CFC0;margin-right:2px}
.tri .kv .dots i{font-style:normal;color:#2E5947}
.tri .start{margin:4px 0 14px;background:#F6F7F3;border-left:3px solid #2E5947;padding:10px 12px;
  font-size:12.5px;color:#3B4A44;line-height:1.85;border-radius:0 6px 6px 0}
.tri .start b{color:#2E5947;display:block;font-size:11px;letter-spacing:1.5px;margin-bottom:3px}
.tri .planx{margin:2px 0 14px;border-top:1px dashed #E7E2D4;padding-top:10px}
.tri .planx summary{list-style:none;cursor:pointer;font-size:12px;font-weight:800;color:#2E5947;
  letter-spacing:.5px;outline:none;padding:12px 0;min-height:44px}
.tri .planx summary::-webkit-details-marker{display:none}
.tri .planx summary::after{content:" ＋";font-weight:400;color:#9AA6A1}
.tri .planx[open] summary::after{content:" －"}
.tri .planx .day{display:flex;gap:9px;padding:7px 0;border-top:1px dashed #EFEBE0;
  font-size:12px;line-height:1.75;color:#4A5A54}
.tri .planx .day:first-of-type{border-top:none;margin-top:8px}
.tri .planx .day b{flex:none;width:36px;color:#9AA6A1;font-size:10px;letter-spacing:.5px}

/* ===== 首推卡：今天先做这件事 ===== */
.tri .firststep{margin:0 0 13px;background:#F2F6F0;border:1px solid #DAE4D8;border-radius:11px;padding:11px 13px}
.tri .firststep .lb{display:block;font-size:10px;font-weight:900;letter-spacing:1.6px;
  color:#2E5947;margin-bottom:5px}
.tri .firststep .tx{font-size:13px;color:#1F3D33;line-height:1.75;font-weight:800}
.tri .firststep .mod{display:block;font-size:11.5px;color:#7D8A84;font-weight:600;margin-top:2px;line-height:1.6}

/* ===== 新增：7 天计划 ===== */
.plan{background:#1F3D33;color:#EFEDE3;border-radius:14px;padding:18px 16px;margin-bottom:12px}
.plan .pt{font-size:11.5px;font-weight:800;letter-spacing:2px;color:#D9C9A8;margin-bottom:4px}
.plan .pn{font-size:16px;font-weight:900;letter-spacing:.5px;margin-bottom:14px;line-height:1.5}
.day{display:flex;gap:10px;padding:9px 0;border-top:1px solid #33544A}
.day:first-of-type{border-top:none}
.day .d{flex:none;width:38px;font-size:11px;font-weight:900;color:#D9C9A8;letter-spacing:.5px;padding-top:2px}
.day .t{flex:1;font-size:13px;color:#E6E2D6;line-height:1.75}
.plan .pfoot{margin-top:13px;padding-top:11px;border-top:1px dashed #3A5A4E;font-size:11.5px;color:#A8B2AB;line-height:1.8}

/* ===== 新增：被现实压下去的提示 ===== */
.downgrade{background:#FBF6E9;border:1px solid #E3D3AE;border-radius:12px;padding:13px 15px;margin:14px 0;
  font-size:12.5px;color:#6B5A2E;line-height:1.85}
.downgrade b{color:#4A3E1C}

@media(max-width:400px){
  .dbar .nm{width:76px}
  .tri .hd{padding:12px 13px}
  .tri .bd{padding:12px 13px 4px}
}
/* ===== 实施指南模块 ===== */
.gd{background:#fff;border:1px solid #E4E0D5;border-radius:14px;padding:18px 16px 6px;margin-bottom:12px}
.gd .gdt{font-size:11.5px;font-weight:800;letter-spacing:2px;color:#2E5947}
.gd .gdn{font-size:12px;color:#8B978F;margin:5px 0 6px;line-height:1.75}
.gsec{padding:11px 0;border-top:1px dashed #E7E2D4}
.gsec .gk{display:flex;gap:7px;align-items:baseline;font-size:12px;font-weight:800;
  color:#2E5947;letter-spacing:.5px;margin-bottom:5px}
.gsec .gk b{font-size:9.5px;font-weight:900;color:#C3BAA1;letter-spacing:1px}
.gsec .gt{font-size:13px;color:#3B4A44;line-height:1.88}
.gsec ul{list-style:none;margin:0;padding:0}
.gsec ul li{font-size:12.5px;color:#3B4A44;line-height:1.85;margin-bottom:6px;
  padding-left:13px;position:relative}
.gsec ul li:last-child{margin-bottom:0}
.gsec ul li:before{content:"";position:absolute;left:2px;top:8px;width:4px;height:4px;
  border-radius:50%;background:#9BB3A6}
.gsec.tune{background:#F6F8F3;border-radius:10px;padding:12px 13px;border-top:none;margin:10px 0 4px}
.gsec .zcost{margin-top:9px;font-size:12px;color:#5B5433;background:#FBF6E7;border:1px solid #E7DCC0;
  border-radius:8px;padding:9px 11px;line-height:1.8}
.gsec .zcost b{display:block;font-size:11px;color:#7A5A33;letter-spacing:.5px;margin-bottom:2px}
.gsec.ai .aic{margin-top:9px;font-size:12px;color:#8A4A32;background:#FBF3EE;
  border-radius:7px;padding:9px 11px;line-height:1.8}
.gsec.ai .aic b{color:#9C5230}
.gsec.pm{border-top:1px dashed #E7E2D4}
.gsec .gsub{font-size:11.5px;color:#8B978F;line-height:1.7;margin:-1px 0 10px}
.pmt{border:1px solid #E9E4D6;border-radius:10px;margin-bottom:9px;overflow:hidden;background:#FCFBF7}
.pmt .pmh{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:2px 7px 2px 11px;min-height:48px;background:#F5F3EB;font-size:11.5px;font-weight:800;
  color:#3B4A44;letter-spacing:.3px}
/* 触控热区：真实盒模型 44×56，不靠伪元素，保证任何浏览器都命中 */
.pmt .pmh button{border:none;background:#2E5947;color:#fff;font-family:inherit;font-size:11.5px;
  font-weight:800;min-height:44px;min-width:56px;padding:0 15px;border-radius:7px;cursor:pointer;
  letter-spacing:.5px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.pmt .pmh button:active{background:#254A3B}
.pmt .pmb{padding:10px 11px;font-size:12px;color:#4A5A54;line-height:1.88}
.tri .gdx{margin-top:2px}
.tri .gdx .gsec:first-of-type{border-top:none;padding-top:2px}
.tri .gdx .gdt,.tri .gdx .gdn{display:none}
.tri .gdx .pmt{margin-bottom:8px}
</style>
</head>

function startQuiz(){
  S = { i:0, secShown:{}, scores:{}, attrs:{}, urgent:1, log:[], hist:[], ev:{}, budget:null, pmt:[] };
  ROUTES.forEach(function(r){ S.scores[r.id]=0; });

  nextQ();
}

function nextQ(){
  if(S.i >= FLAT.length){ return renderResult(); }
  var Q = FLAT[S.i];
  if(!S.secShown[Q._sec]){
    S.secShown[Q._sec] = true;
    return renderSection(Q._sec);
  }
  hud.style.display='block';
  hud.innerHTML = '<div class="row"><span class="sec">'+SECTIONS[Q._sec].t+'</span>' +
    '<span class="step">第 '+(S.i+1)+' / '+FLAT.length+' 题</span></div>' +
    '<div class="track"><div class="fill" style="width:'+(S.i/FLAT.length*100)+'%"></div></div>';
  var h = '<div class="screen">';
  if (S.i > 0) h += '<div class="qback" data-act="back">‹ 上一题</div>';
  if(Q.tag) h += '<div class="tag t-mid">'+Q.tag+'</div>';
  h += '<div class="hint" style="margin-bottom:6px">'+Q.lead+'</div>';
  h += '<h1 style="font-size:19px;margin-bottom:16px">'+Q.q+'</h1>';
  Q.opts.forEach(function(o,i){
    h += '<div class="opt" id="opt'+i+'" data-i="'+i+'">' +
         '<span class="idx">'+"ABCD"[i]+'</span>' +
         '<span class="tx">'+o.t+'<span class="sub">'+o.sub+'</span></span></div>';
  });
  h += '</div>';
  view.innerHTML = h;
  /* 事件委托绑定：比内联 onclick 兼容性好，部分内置浏览器会过滤内联事件 */
  Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(el){
    var i = parseInt(el.getAttribute('data-i'), 10);
    var lastTouch = 0, sx = 0, sy = 0;
    el.addEventListener('touchstart', function(e){
      var t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    }, {passive:true});
    el.addEventListener('touchend', function(e){
      var t = e.changedTouches[0];
      /* 手指滑动超过 12px 视为滚动页面，不算点选 */
      if (Math.abs(t.clientX - sx) > 12 || Math.abs(t.clientY - sy) > 12) return;
      lastTouch = Date.now();
      choose(i);
    });
    el.addEventListener('click', function(e){
      if (Date.now() - lastTouch < 600) return;  /* 触摸后跟来的合成 click 不重复计 */
      choose(i);
    });
  });
  window.scrollTo(0,0);
}

function renderSection(si){

  for(i=0;i<FLAT.length;i++){ if(FLAT[i]._sec===si){ startN=i+1; break; } }
  var endN = startN;
  for(i=0;i<FLAT.length;i++){ if(FLAT[i]._sec===si){ endN=i+1; } }
  view.innerHTML =
   '<div class="chapter">' +
     '<div class="cn">第 '+(si+1)+' 部分 · 题 '+startN+'–'+endN+'</div>' +
     '<div class="ct">'+sec.t+'</div>' +
     '<div class="cd">'+sec.d+'</div>' +
     '<button class="btn main" data-act="next">继续</button>' +
     (si > 0 ? '<div class="qback" data-act="back" style="margin:18px auto 0;align-self:center">‹ 回到上一部分最后一题</div>' : '') +
   '</div>';
  window.scrollTo(0,0);
}

/* 全局事件委托：data-act 按钮 + .opt 选项（兼容过滤内联事件的内置浏览器） */
document.addEventListener('click', function(e){
  var t = e.target;
  while (t && t !== document.body){
    if (t.getAttribute && t.getAttribute('data-act') === 'start'){ startQuiz(); return; }
    if (t.getAttribute && t.getAttribute('data-act') === 'next'){ nextQ(); return; }
    if (t.getAttribute && t.getAttribute('data-act') === 'copy'){ copyShare(); return; }
    if (t.getAttribute && t.getAttribute('data-act') === 'pcopy'){ copyPmt(parseInt(t.getAttribute('data-i'),10), t); return; }
    if (t.getAttribute && t.getAttribute('data-act') === 'back'){ goBack(); return; }
    if (t.getAttribute && t.getAttribute('data-act') === 'jump'){ jumpTo(t.getAttribute('data-to')); return; }
    t = t.parentNode;
  }
});

function choose(i){
  var Q = FLAT[S.i], o = Q.opts[i];
  /* 存档：返回上一题时整份还原，避免扣分/加分残留 */
  S.hist.push({ i:S.i, scores:JSON.parse(JSON.stringify(S.scores)), attrs:JSON.parse(JSON.stringify(S.attrs)),
                ev:JSON.parse(JSON.stringify(S.ev)), urgent:S.urgent, budget:S.budget, logLen:S.log.length });
  document.querySelectorAll('.opt').forEach(function(el,j){
    if(j!==i) el.classList.add('dim');
  });
  document.getElementById('opt'+i).classList.add('picked');
  Object.keys(o.w||{}).forEach(function(id){
    S.scores[id]=(S.scores[id]||0)+o.w[id];
    /* 只记强信号（权重>=2），用作结果页的「为什么推你」证据 */
    if (o.w[id] >= 2){ (S.ev[id] = S.ev[id] || []).push({ n:S.i+1, t:o.t, w:o.w[id] }); }
  });
  Object.keys(o.m||{}).forEach(function(k){ S.attrs[k]=clamp(S.attrs[k]+o.m[k],15,95); });
  if (typeof o.u === 'number') S.urgent = o.u;
  /* 预算题单独存原始选项：3 = 500 以内。这条信号独立于全卷累积分，不会被后面的题抵消 */
  if (Q.k === 'budget') S.budget = i;
  S.log.push({ q:Q.q, c:o.t, i:i });
  setTimeout(function(){ S.i++; nextQ(); }, 300);
}

function goBack(){
  if (!S || !S.hist.length) return;
  var h = S.hist.pop();
  S.scores = h.scores; S.attrs = h.attrs; S.ev = h.ev; S.urgent = h.urgent;
  S.budget = h.budget; S.i = h.i;
  S.log.length = h.logLen;
  nextQ();
}

/* 低预算信号：明确选过「500 以内」就直接成立，不靠累积分；没答过那题才看累积分 */
function lowCash(){
  if (!S) return false;
  if (S.budget === 3) return true;
  return S.attrs["现金"] <= 48;
}

/* ==================== 匹配 ==================== */
/* 第一层：兴趣加权分（S.scores）
   第二层：现实可行性系数 fit —— 时间、钱、技能、见钱速度四道闸
   最终分 = 兴趣分 × fit，排序取前三 */
function fitOf(r, a, urgent){
  var fit = 1, why = [];
  var t = a["时间"], c = a["现金"], s = a["技能"];

  /* 时间闸：这条路要的时间，明显超过你能给的时间 */
  if (r.needTime >= 5 && t < 58){ fit *= 0.58; why.push("time"); }
  else if (r.needTime === 4 && t < 48){ fit *= 0.74; why.push("time"); }
  else if (r.needTime <= 2 && t >= 60){ fit *= 1.05; }

  /* 资金闸：启动资金要求高于你手上的钱 */
  if (r.needCash >= 4 && c < 60){ fit *= 0.58; why.push("cash"); }
  else if (r.needCash === 3 && c < 46){ fit *= 0.76; why.push("cash"); }

  /* 技能闸：门槛明显高于你现有的手艺 */
  if (r.needSkill >= 5 && s < 64){ fit *= 0.52; why.push("skill"); }
  else if (r.needSkill === 4 && s < 50){ fit *= 0.76; why.push("skill"); }

  /* 紧迫度闸：急着要钱，就不该推慢路 */
  if (urgent >= 3){
    if (r.speed <= 1){ fit *= 0.30; why.push("slow"); }
    else if (r.speed === 2){ fit *= 0.42; why.push("slow"); }
    else if (r.speed >= 4){ fit *= 1.18; }
  } else if (urgent === 2){
    if (r.speed <= 1){ fit *= 0.60; why.push("slow"); }
    else if (r.speed === 2){ fit *= 0.80; why.push("slow"); }
    else if (r.speed >= 4){ fit *= 1.10; }
  } else {
    /* 不急的人，慢路反而合适 */
    if (r.speed <= 2){ fit *= 1.10; }
  }

  return { fit: Math.max(0.28, fit), why: why };
}

/* 选前三：急需钱的人，慢路直接排除在推荐之外（快路有 11 条，够用） */
function pickTop(arr, urgent){
  var sorted = arr.slice().sort(function(a,b){ return b.final-a.final || (a.r.id<b.r.id?-1:1); });
  if (urgent >= 3){
    var fast = sorted.filter(function(x){ return x.r.speed >= 3; });
    var slow = sorted.filter(function(x){ return x.r.speed < 3; });
    return fast.concat(slow).slice(0,3);
  }
  return sorted.slice(0,3);
}

function compute(){
  var arr = ROUTES.map(function(r){
    var base = S.scores[r.id] || 0;
    var f = fitOf(r, S.attrs, S.urgent);
    return { r:r, base:base, fit:f.fit, final:base*f.fit, flags:f.why };
  });
  var byFinal = arr.slice().sort(function(a,b){ return b.final-a.final || (a.r.id<b.r.id?-1:1); });
  var byBase  = arr.slice().sort(function(a,b){ return b.base-a.base  || (a.r.id<b.r.id?-1:1); });
  var top3 = pickTop(arr, S.urgent);
  var maxFinal = top3[0].final || 1;
  top3.forEach(function(x){ x.pct = Math.round(x.final / maxFinal * 100); });
  byFinal.forEach(function(x){ if (typeof x.pct === 'undefined') x.pct = Math.round(x.final / maxFinal * 100); });

  /* 组倾向：用 final 分（兴趣 × 现实）算，和上面三条推荐同一个口径 */
  var gSum={}, gCnt={}, finMap={};
  arr.forEach(function(x){ finMap[x.r.id]=x.final; });
  ROUTES.forEach(function(r){
    gSum[r.group]=(gSum[r.group]||0)+ (finMap[r.id]||0);
    gCnt[r.group]=(gCnt[r.group]||0)+1;
  });
  var gAvg={}, total=0;
  Object.keys(gSum).forEach(function(g){ gAvg[g]=gSum[g]/gCnt[g]; total+=gAvg[g]; });
  var shares={}, floorSum=0, rest=[];
  Object.keys(gAvg).forEach(function(g){
    var exact = total>0 ? gAvg[g]/total*100 : 25;
    shares[g] = Math.floor(exact);
    floorSum += shares[g];
    rest.push([g, exact-shares[g]]);
  });
  rest.sort(function(a,b){ return b[1]-a[1]; });
  for(var k=0; floorSum<100 && k<rest.length; k++, floorSum++){ shares[rest[k][0]]++; }

  return { all:arr, top:top3, byBase:byBase, shares:shares, maxFinal:maxFinal };
}

/* 入门难度：由技能门槛、时间投入、启动资金三项合成，只给档位，不编收益 */
function diffOf(r){
  var d = r.needSkill * 0.5 + r.needTime * 0.28 + r.needCash * 0.22;
  var lv = Math.max(1, Math.min(5, Math.round(d)));
  var label = ["", "很容易上手", "不难", "中等", "偏难", "门槛较高"][lv];
  return { lv: lv, label: label };
}

  return out.slice(0, 3);
}

/* 成本描述 */
function costOf(r){
  var cashTxt = ["", "基本不花钱", "五百以内", "一千到三千", "三千到八千", "八千以上"][r.needCash] || "看情况";
  var timeTxt = ["", "每周两三小时", "每周三到六小时", "每周六到十小时", "每周十小时以上", "几乎占满业余时间"][r.needTime] || "看情况";
  return { cash: cashTxt, time: timeTxt };
}

/* ==================== 实施指南（地图 + AI + 提示词） ==================== */
function guideHTML(r, a, urgent){
  var g = GUIDE[r.id];
  if (!g) return "";
  var h = "";
  var low = lowCash(), z = ZC[r.id];
  var rows = [["01","要准备什么", g.tools],
              ["02","第一个样品怎么做", g.sample],
              ["03","去哪找第一批客户", g.find],
              ["04","怎么用最小成本验证", g.test],
              ["05","可以怎么收钱", g.money],
              ["06","什么时候该停", g.stop]];
  rows.forEach(function(row){
    var extra = "";
    if (row[0] === "04" && low && z){
      extra = '<div class="zcost"><b>按你的预算（不超过 500）</b>'+
              '这条路上最容易把钱花在'+z.cost+'上。'+z.how+'——验证收到钱之前，别买任何东西。</div>';
    }
    h += '<div class="gsec"><div class="gk"><b>'+row[0]+'</b>'+row[1]+'</div>' +
         '<div class="gt">'+row[2]+'</div>'+extra+'</div>';
  });

  /* 个性化：按牌面调整 */
  h += '<div class="gsec tune"><div class="gk"><b>07</b>按你的情况调整</div><ul>';
  tuneOf(r, a, urgent).forEach(function(t){ h += '<li>'+t+'</li>'; });
  h += '</ul></div>';

  /* AI 辅助 */
  h += '<div class="gsec ai"><div class="gk"><b>08</b>AI 能帮你做什么</div><ul>';
  g.ai.can.forEach(function(t){ h += '<li>'+t+'</li>'; });
  h += '</ul><div class="aic"><b>AI 干不掉的：</b>'+g.ai.cant+'</div></div>';

  /* 可复制提示词 */
  h += '<div class="gsec pm"><div class="gk"><b>09</b>可以直接复制的提示词</div>' +
       '<div class="gsub">把 ___ 换成你的真实情况，粘进任意 AI 对话框就能用</div>';
  g.ai.prompts.forEach(function(p){
    var i = S.pmt.length;
    S.pmt.push(p.p);
    h += '<div class="pmt"><div class="pmh"><span>'+p.t+'</span>' +
         '<button data-act="pcopy" data-i="'+i+'">复制</button></div>' +
         '<div class="pmb">'+p.p+'</div></div>';
  });
  h += '</div>';
  return h;
}

/* ==================== 结果页 ==================== */
function renderResult(){
  hud.style.display='none';
  S.pmt = [];                     /* 提示词池：按渲染顺序编号，供复制按钮使用 */
  var C = compute();
  var T = C.top, first = T[0], a = S.attrs, urgent = S.urgent;
  var h = '<div class="endwrap">';

  h += '<div class="endtitle"><div class="st">测试结果 · 不辞职</div>' +
       '<div class="en">'+first.r.name+'</div>' +
       '<div class="ec">'+GROUPNAME[first.r.group]+' · 从这三条里先试第一条</div></div>';

  /* 页内导航：手机端横向滑动，跳转位置避开吸顶条 */
  h += '<nav class="rnav" id="rnav">' +
       '<b data-act="jump" data-to="rsecTop">首推方向</b>' +
       '<b data-act="jump" data-to="rsecToday">今天第一步</b>' +
       '<b data-act="jump" data-to="rsecGuide">实施地图</b>' +
       '<b data-act="jump" data-to="rsecPmts">AI 提示词</b>' +
       '<b data-act="jump" data-to="rsecPlan">七天计划</b>' +
       '</nav>';

  /* 一句结论：结合紧迫度给不同的话 */
  var line;
  if (urgent >= 3) line = "你急着要钱，所以下面三条都优先选了<b>能在一两个月内见到收入</b>的。那些要养半年才有回报的路，我先给你压下去了。";
  else if (urgent === 2) line = "你有一点时间压力，但不算火烧眉毛。下面三条是<b>能起量、又不至于让你空转太久</b>的。";
  else line = "你不急着变现，这是优势。下面三条都允许你<b>先做出来再想卖</b>，不用一开始就算账。";
  h += '<div class="verdict" style="text-align:left;font-weight:600;font-size:13.5px">'+line+'</div>';

  /* 三条推荐 */
  h += '<div class="dossier" id="rsecTop" style="background:none;border:none;padding:0;margin-bottom:4px">' +
       '<div class="dt">先 试 这 三 条</div></div>';

  var usedWhy = {};
  T.forEach(function(x, idx){
    var c = costOf(x.r), whys = whyOf(x, a, urgent, idx, T[0].r.name, usedWhy), av = avoidWho(x);
    h += '<div class="tri'+(idx===0?' first':'')+'">';
    h += '<div class="hd"><span class="no">'+(idx+1)+'</span>' +
         '<span class="nm">'+x.r.name+'</span>' +
         '<span class="no2">'+GROUPNAME[x.r.group]+(idx===0?' · 首推':'')+'</span></div>';
    h += '<div class="bd">';

    /* 首推卡第一行：今天就能做完的一件具体事 */
    if (idx === 0){
      var td = todayOf(x.r, a, urgent);
      h += '<div class="firststep" id="rsecToday"><span class="lb">今 天 先 做 这 件 事</span>' +
           '<span class="tx">'+td.t+'</span>' +
           (td.mod ? '<span class="mod">'+td.mod+'</span>' : '') + '</div>';
    }

    h += '<div class="why">'+whys.join("；")+'。</div>';

    var cashNote = x.r.needCash <= 1 ? "，几乎是零成本启动" : (x.r.needCash >= 3 ? "，要先备一笔货" : "");
    h += '<div class="kv"><span class="k">启动成本</span><span class="v"><b>'+c.cash+'</b>'+cashNote+'</span></div>';
    h += '<div class="kv"><span class="k">投入时间</span><span class="v">'+c.time+ (x.r.needTime>=4 ? "，<b>会和你的休息时间抢</b>" : "，不至于占满晚上") +'</span></div>';
    var d = diffOf(x.r);
    h += '<div class="kv"><span class="k">入门难度</span><span class="v"><span class="dots"><i>'+new Array(d.lv+1).join("●")+'</i>'+new Array(6-d.lv).join("○")+'</span> '+d.label+'</span></div>';
    h += '<div class="kv fit"><span class="k">适合谁</span><span class="v">'+fitWho(x, a)+'</span></div>';
    h += '<div class="kv risk"><span class="k">主要风险</span><span class="v">'+x.r.risk+'</span></div>';
    if (av) h += '<div class="kv avoid"><span class="k">先别碰</span><span class="v">'+av+'。</span></div>';
    if (idx > 0){
      h += '<div class="start"><b>新 手 第 一 步</b>'+x.r.start+'</div>';
      h += '<details class="planx"><summary>看它的七天计划</summary>';
      x.r.plan.forEach(function(t, i){ h += '<div class="day"><b>DAY '+(i+1)+'</b><span>'+t+'</span></div>'; });
      h += '</details>';
      h += '<details class="planx gdx"><summary>看它的实施地图和 AI 用法</summary>';
      h += guideHTML(x.r, a, urgent);
      h += '</details>';
    }
    h += '</div></div>';
  });

  /* 被现实压下去的那条 */
  var topBase = C.byBase[0];
  var firstBaseRank = C.top.map(function(x){ return x.r.id; }).indexOf(topBase.r.id);
  if (topBase.r.id !== first.r.id && firstBaseRank !== 0){
    var whyTxt = "";
    if (topBase.flags.indexOf("slow") >= 0) whyTxt = "它见钱太慢，而你现在等不起";
    else if (topBase.flags.indexOf("cash") >= 0) whyTxt = "它要先投一笔钱，你现在的预算不够";
    else if (topBase.flags.indexOf("skill") >= 0) whyTxt = "它对技能门槛要求高，你现在还接不住";
    else if (topBase.flags.indexOf("time") >= 0) whyTxt = "它要的时间比你给得起的多";
    if (whyTxt){
      h += '<div class="downgrade"><b>顺便说一句。</b>按你的兴趣，<b>'+topBase.r.name+
           '</b>分数其实是最高的，我没有把它排第一——'+whyTxt+
           '。等条件变了，它可以再捡起来。</div>';
    }
  }

  /* 实施指南：首推路线完整展开 */
  h += '<div class="gd" id="rsecGuide">' +
       '<div class="gdt">如 何 开 始 实 施</div>' +
       '<div class="gdn">下面整套做法是「'+first.r.name+'」的，已经按你的时间、预算和技能调过。想换一条，第 2、3 名卡片里也各有自己的一份。</div>' +
       guideHTML(first.r, a, urgent) +
       '</div>';

  /* 7 天计划 */
  h += '<div class="plan" id="rsecPlan">';
  h += '<div class="pt">七 天 计 划</div>';
  h += '<div class="pn">从明天开始，做「'+first.r.name+'」</div>';
  first.r.plan.forEach(function(t, i){
    h += '<div class="day"><span class="d">DAY '+(i+1)+'</span><span class="t">'+t+'</span></div>';
  });
  h += '<div class="pfoot">七天做完，你会知道自己是不是真愿意干这件事。'+
       '如果做到第三天就想放弃，那不是失败，是省下了三个月。</div>';
  h += '</div>';

  /* 牌面 */
  h += '<div class="dossier"><div class="dt">你 现 在 的 牌 面</div>';
  KEYS.forEach(function(k){
    h += '<div class="dbar"><span class="nm">'+k+'</span>' +
         '<span class="track"><span class="fill" style="width:'+a[k]+'%"></span></span>' +
         '<span class="v">'+a[k]+'</span></div>';
  });
  var hi = KEYS.slice().sort(function(x,y){ return a[y]-a[x]; })[0];
  var lo = KEYS.slice().sort(function(x,y){ return a[x]-a[y]; })[0];
  var meta = '你最大的牌是<b>「'+hi+'」</b>，最大的坑是<b>「'+lo+'」</b>。';
  if(a["时间"]<=42) meta += '<br><span class="warn">时间这张牌偏薄——别选要日更的路，你撑不过第三周。</span>';
  if(a["心力"]<=38) meta += '<br><span class="warn">心力偏低——副业多半死在第三周，不是死在没客户。</span>';
  if(S.budget === 3) meta += '<br><span class="warn">你在第 2 题选了「500 以内」——就按这个预算走，别碰要备货、要投流的。</span>';
  else if(a["现金"]<=48) meta += '<br><span class="warn">现金偏薄——别碰要备货、要投流的，先卖时间。</span>';
  if(a["技能"]>=66) meta += '<br>技能很硬。卖时间这条路，你起步就比大部分人快。';
  if(a["人脉"]>=66) meta += '<br>人脉很厚。你的第一批客户不用从零开始找。';
  h += '<div class="dmeta">'+meta+'</div></div>';

  /* 四大赚法 */
  h += '<div class="dossier"><div class="dt">四 大 赚 法 倾 向</div>';
  [["time","卖时间"],["content","做内容"],["goods","卖货"],["expert","卖专业"]].forEach(function(g){
    var hot = (g[0]===first.r.group);
    h += '<div class="dbar"><span class="nm">'+g[1]+'</span>' +
         '<span class="track"><span class="fill'+(hot?' hot':'')+'" style="width:'+C.shares[g[0]]+'%"></span></span>' +
         '<span class="v">'+C.shares[g[0]]+'%</span></div>';
  });
  h += '<div class="dmeta">这是算上你现实条件之后的倾向，和上面三条推荐是同一个算法。第一名所在的赚法会标深色。</div></div>';

  /* 分享 */
  var shareTxt = '做完 28 题的「不辞职我还能干什么」：最该先试的是【'+first.r.name+
    '】（'+GROUPNAME[first.r.group]+'），另外两条是'+T[1].r.name+'和'+T[2].r.name+
    '。第一名还给了我一份七天计划。你测测你能干什么？';
  h += '<div class="share"><div class="st">测完了</div>' +
       '<div class="sx">把结果发出去，看看你朋友不辞职会干什么。大部分人的答案，和他们自己以为的不一样。</div>' +
       '<button data-act="copy" id="cpBtn">复制测试结果</button></div>';
  S.shareTxt = shareTxt;

  h += '<button class="btn main" data-act="start">重新测一次</button>';
  h += '<div class="hint" style="margin-top:14px;text-align:center">28 道题，16 条路。换几个答案，可能就是另一种下班后的生活。</div>';
  h += '</div>';

  view.innerHTML = h;
  /* 首推路线实施指南里的「09 提示词」挂锚点；另外两条在折叠里，不参与导航 */
  var pmSec = view.querySelector('.gd .gsec.pm');
  if (pmSec) pmSec.id = 'rsecPmts';
  window.scrollTo(0,0);
}

/* 页内导航跳转：避开吸顶条高度，跳完短暂高亮 */
function jumpTo(id){
  var el = document.getElementById(id);
  if (!el) return;
  var nav = document.getElementById('rnav');
  var off = (nav ? nav.offsetHeight : 44) + 10;
  var top = el.getBoundingClientRect().top + (window.pageYOffset || document.documentElement.scrollTop || 0);
  window.scrollTo(0, Math.max(0, top - off));
  if (nav){
    Array.prototype.forEach.call(nav.children, function(c){
      c.className = (c.getAttribute('data-to') === id) ? 'on' : '';
    });
  }
}

function copyShare(){
  var t = S.shareTxt || "";
  var done = function(){ var b = document.getElementById('cpBtn'); if(b){ b.textContent = "已复制 ✓"; } };
  var bad  = function(){ var b = document.getElementById('cpBtn'); if(b){ b.textContent = "复制失败，请长按选中"; } };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done, function(){ fallbackCopy(t) ? done() : bad(); });
  } else { fallbackCopy(t) ? done() : bad(); }
}
function copyPmt(i, btn){
  var t = (S.pmt || [])[i];
  if (!t) return;
  var reset = function(){ if(btn){ btn.textContent = "复制"; btn.style.background = ""; } };
  var done = function(){
    if (!btn) return;
    btn.textContent = "已复制 ✓";
    btn.style.background = "#254A3B";
    setTimeout(reset, 1400);
  };
  var bad = function(){
    if (!btn) return;
    btn.textContent = "复制失败，长按选中";
    btn.style.background = "#9C5230";
    setTimeout(reset, 2200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done, function(){ fallbackCopy(t) ? done() : bad(); });
  } else { fallbackCopy(t) ? done() : bad(); }
}
function fallbackCopy(t){
  var ok = false;
  var ta = document.createElement('textarea'); ta.value = t;
  ta.style.position='fixed'; ta.style.left='-9999px'; ta.style.top='0';
  document.body.appendChild(ta); ta.select();
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  return ok;
}

renderCover();
