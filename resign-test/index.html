   '<div class="screen" style="text-align:center;padding-top:52px">' +
     '<div class="stamp">辞职之后</div>' +
     '<h1 style="font-size:22px">你会走哪条路？</h1>' +
     '<div class="lead" style="text-align:left;margin-top:18px">' +
       '原作里，30 岁那年你有 <b>16 条路</b>可走。<br>' +
       '这次反过来——<b>先别辞职</b>，用 36 道题，' +
       '把这 16 条路一条条在你身上过一遍，测出你真走到那个下午会选哪条。</div>' +
     '<div class="card" style="text-align:left"><div class="k">这个测试怎么算</div>' +
       '<div class="d"><b>第一、二部分</b>（12 题）：你的牌面——钱、身体、家里、你怕什么。<br>' +
       '<b>第三部分</b>（16 题）：原作 16 条路线，每条的真实场景问你一遍，' +
       '独立设计师的「先出三版」、摆摊的「城管来了」、考公的「行测差五分」……<br>' +
       '<b>第四部分</b>（8 题）：你这个人——熬得住吗，跟不跟人搭伙，几点起床。<br><br>' +
       '每个选项都在给路线加权，也在改你的六张底牌（存款 / 体力 / 心力 / 手艺 / 人脉 / 名声）。</div></div>' +
     '<div class="card" style="text-align:left"><div class="k">交个底</div>' +
       '<div class="d">36 题 · 约 8 分钟 · 没有对错答案，凭直觉选。' +
       '不喜欢某条路就直说——「打死不干」和「这是我的梦」一样，都是有效数据。</div></div>' +
     '<button class="btn main" data-act="start">开始测试</button>' +
   '</div>';
  window.scrollTo(0,0);
}

function startQuiz(){
  S = { i:0, secShown:{}, scores:{}, attrs:{}, log:[] };
  ROUTES.forEach(function(r){ S.scores[r.id]=0; });
  KEYS.forEach(function(k){ S.attrs[k]=50; });
  nextQ();
}

function nextQ(){
  if(S.i >= FLAT.length){ return renderResult(); }
  var Q = FLAT[S.i];
  // 新章节 → 先出章节幕
  if(!S.secShown[Q._sec]){
    S.secShown[Q._sec] = true;
    return renderSection(Q._sec);
  }
  hud.style.display='block';
  hud.innerHTML = '<div class="row"><span class="sec">'+SECTIONS[Q._sec].t+'</span>' +
    '<span class="step">第 '+(S.i+1)+' / '+FLAT.length+' 题</span></div>' +
    '<div class="track"><div class="fill" style="width:'+(S.i/FLAT.length*100)+'%"></div></div>';
  var h = '<div class="screen">';
  if(Q.tag) h += '<div class="tag t-mid">'+Q.tag+'</div>';
  h += '<div class="hint" style="margin-bottom:6px">'+Q.lead+'</div>';
  h += '<h1 style="font-size:19px;margin-bottom:16px">'+Q.q+'</h1>';
  Q.opts.forEach(function(o,i){
    h += '<div class="opt" id="opt'+i+'" data-i="'+i+'">' +
         '<span class="idx">'+"ABCD"[i]+'</span>' +
         '<span class="tx">'+o.t+'<span class="sub">'+o.sub+'</span></span></div>';
  });
  h += '</div>';
  view.innerHTML = h;
  /* 事件委托绑定：比内联 onclick 兼容性好，部分内置浏览器会过滤内联事件 */
  Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(el){
    var i = parseInt(el.getAttribute('data-i'), 10);
    var lastTouch = 0, sx = 0, sy = 0;
    el.addEventListener('touchstart', function(e){
      var t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    }, {passive:true});
    el.addEventListener('touchend', function(e){
      var t = e.changedTouches[0];
      /* 手指滑动超过 12px 视为滚动页面，不算点选 */
      if (Math.abs(t.clientX - sx) > 12 || Math.abs(t.clientY - sy) > 12) return;
      lastTouch = Date.now();
      choose(i);
    });
    el.addEventListener('click', function(e){
      if (Date.now() - lastTouch < 600) return;  /* 触摸后跟来的合成 click 不重复计 */
      choose(i);
    });
  });
  window.scrollTo(0,0);
}

function renderSection(si){
  hud.style.display='none';
  var sec = SECTIONS[si];
  var startN = 0, i;
  for(i=0;i<FLAT.length;i++){ if(FLAT[i]._sec===si){ startN=i+1; break; } }
  var endN = startN;
  for(i=0;i<FLAT.length;i++){ if(FLAT[i]._sec===si){ endN=i+1; } }
  view.innerHTML =
   '<div class="chapter">' +
     '<div class="cn">第 '+(si+1)+' 部分 · 题 '+startN+'–'+endN+'</div>' +
     '<div class="ct">'+sec.t+'</div>' +
     '<div class="cd">'+sec.d+'</div>' +
     '<button class="btn main" data-act="next">继续</button>' +
   '</div>';
  window.scrollTo(0,0);
}

/* 全局事件委托：data-act 按钮 + .opt 选项（兼容过滤内联事件的内置浏览器） */
document.addEventListener('click', function(e){
  var t = e.target;
  while (t && t !== document.body){
    if (t.getAttribute && t.getAttribute('data-act') === 'start'){ startQuiz(); return; }
    if (t.getAttribute && t.getAttribute('data-act') === 'next'){ nextQ(); return; }
    if (t.getAttribute && t.getAttribute('data-act') === 'copy'){ copyShare(); return; }
    t = t.parentNode;
  }
});

function choose(i){
  var Q = FLAT[S.i], o = Q.opts[i];
  document.querySelectorAll('.opt').forEach(function(el,j){
    el.onclick=null;
    if(j!==i) el.classList.add('dim');
  });
  document.getElementById('opt'+i).classList.add('picked');
  Object.keys(o.w||{}).forEach(function(id){ S.scores[id]=(S.scores[id]||0)+o.w[id]; });
  Object.keys(o.m||{}).forEach(function(k){ S.attrs[k]=clamp(S.attrs[k]+o.m[k],15,95); });
  S.log.push({ q:Q.q, c:o.t });
  setTimeout(function(){ S.i++; nextQ(); }, 300);
}

/* ==================== 结算 ==================== */
function compute(){
  var gSum={}, gCnt={};
  ROUTES.forEach(function(r){
    gSum[r.group]=(gSum[r.group]||0)+S.scores[r.id];
    gCnt[r.group]=(gCnt[r.group]||0)+1;
  });
  var gAvg={}, total=0;
  Object.keys(gSum).forEach(function(g){ gAvg[g]=gSum[g]/gCnt[g]; total+=gAvg[g]; });
  var shares={}, floorSum=0, rest=[];
  Object.keys(gAvg).forEach(function(g){
    var exact = gAvg[g]/total*100;
    shares[g] = Math.floor(exact);
    floorSum += shares[g];
    rest.push([g, exact-shares[g]]);
  });
  rest.sort(function(a,b){ return b[1]-a[1]; });
  for(var k=0; floorSum<100 && k<rest.length; k++, floorSum++){ shares[rest[k][0]]++; }
  var ranked = ROUTES.slice().sort(function(a,b){ return S.scores[b.id]-S.scores[a.id] || (a.id<b.id?-1:1); });
  return { gAvg:gAvg, shares:shares, ranked:ranked };
}

function renderResult(){
  hud.style.display='none';
  var C = compute();
  var top = C.ranked[0], top5 = C.ranked.slice(0,5);
  var maxScore = S.scores[top.id] || 1;
  var a = S.attrs;

  var h = '<div class="endwrap">';
  h += '<div class="endtitle"><div class="st">测试结果 · 辞职之后</div>' +
       '<div class="en">'+top.name+'</div>' +
       '<div class="ec">'+GROUPNAME[top.group]+' · 匹配度 '+C.shares[top.group]+'%</div></div>';

  h += '<div class="card"><div class="k">这条路的样子</div>' +
       '<div class="v">'+top.menmen+'</div>' +
       '<div class="d">'+GROUPVERDICT[top.group]+'</div></div>';

  h += '<div class="verdict">测试只能测出你现在的想法。<br>真正的答案，写在交辞职信的那个下午。</div>';

  // 四大方向
  h += '<div class="dossier"><div class="dt">四 大 方 向 倾 向</div>';
  [["craft","做自己的东西"],["biz","做一门生意"],["exam","回学校再读一次"],["job","回去上班"]].forEach(function(g){
    var hot = (g[0]===top.group);
    h += '<div class="dbar"><span class="nm">'+g[1]+'</span>' +
         '<span class="track"><span class="fill'+(hot?' hot':'')+'" style="width:'+C.shares[g[0]]+'%"></span></span>' +
         '<span class="v">'+C.shares[g[0]]+'%</span></div>';
  });
  h += '<div class="dmeta">占比 = 你在这 36 题里对这个方向的偏向程度，不是成功概率。</div></div>';

  // 最像的五条路
  h += '<div class="dossier"><div class="dt">最 像 你 的 五 条 路</div>';
  top5.forEach(function(r,idx){
    var pct = Math.round(S.scores[r.id]/maxScore*100);
    h += '<div class="dbar"><span class="nm">'+(idx+1)+'. '+r.name+'</span>' +
         '<span class="track"><span class="fill'+(idx===0?' hot':'')+'" style="width:'+pct+'%"></span></span>' +
         '<span class="v">'+pct+'%</span></div>';
    h += '<div style="font-size:11.5px;color:#9AA6A1;margin:-4px 0 8px;padding-left:96px">'+r.menmen+'</div>';
  });
  h += '</div>';

  // 牌面
  h += '<div class="dossier"><div class="dt">你 现 在 的 牌 面</div>';
  KEYS.forEach(function(k){
    h += '<div class="dbar"><span class="nm">'+k+'</span>' +
         '<span class="track"><span class="fill" style="width:'+a[k]+'%"></span></span>' +
         '<span class="v">'+a[k]+'</span></div>';
  });
  var hi = KEYS.slice().sort(function(x,y){ return a[y]-a[x]; })[0];
  var lo = KEYS.slice().sort(function(x,y){ return a[x]-a[y]; })[0];
  var meta = '你最大的牌是<b>「'+hi+'」</b>，最大的坑是<b>「'+lo+'」</b>。';
  if(a["存款"]<=38) meta += '<br><span class="warn">存款这张牌偏薄——真辞职之前，先算清你能撑几个月。</span>';
  if(a["体力"]<=38) meta += '<br><span class="warn">体力偏低——辞职前先给身体做个体检，它要扛三年。</span>';
  if(a["心力"]>=72) meta += '<br>心力很足。这东西比存款还稀缺，护住它。';
  if(a["手艺"]>=72) meta += '<br>手艺很硬。这是 16 条路里最通用的货币。';
  h += '<div class="dmeta">'+meta+'</div></div>';

  // 分享
  var shareTxt = '做完 36 题的「辞职之后我会走哪条路」：我最可能的是【'+top.name+'】（'+GROUPNAME[top.group]+
    '）。最像我的前三：'+top5.slice(0,3).map(function(r){ return r.name; }).join('、')+
    '。四大方向：做自己的东西 '+C.shares.craft+'% / 做生意 '+C.shares.biz+
    '% / 回学校 '+C.shares.exam+'% / 回去上班 '+C.shares.job+'%。你敢测一局吗？';
  h += '<div class="share"><div class="st">测完了</div>' +
       '<div class="sx">把你的路线发出去，看看你朋友辞职会走哪条。大部分人的结果，和他们的直觉不一样。</div>' +
       '<button data-act="copy" id="cpBtn">复制测试结果</button></div>';
  S.shareTxt = shareTxt;

  h += '<button class="btn main" data-act="start">重新测一次</button>';
  h += '<div class="hint" style="margin-top:14px;text-align:center">路线一共 16 条，题有 36 道。换几个答案，可能就是另一条人生。</div>';
  h += '</div>';

  view.innerHTML = h;
  window.scrollTo(0,0);
}

function copyShare(){
  var t = S.shareTxt || "";
  var done = function(){ var b = document.getElementById('cpBtn'); if(b){ b.textContent = "已复制 ✓"; } };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done, function(){ fallbackCopy(t); done(); }); }
  else { fallbackCopy(t); done(); }
}
function fallbackCopy(t){
  var ta = document.createElement('textarea'); ta.value = t; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

renderCover();
</script>
